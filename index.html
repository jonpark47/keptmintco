      // with shipping costs or find your own tracking is shared with the buyer") — a real
      // section heading is always short (just the word, maybe with a little glued noise);
      // a full multi-clause sentence never is. Capping the ANCHOR LINE's own length (not the
      // title text pulled from it) rules this out structurally, rather than trying to
      // enumerate every sentence eBay's static page copy could ever glue "item" into.
      for (var i=0;i<lines.length;i++){ if (anchorRe.test(lines[i]) && lines[i].length <= 60){ idx = i; break; } }
      if (idx < 0) return null;
      var best = null;
      for (var j=idx; j<lines.length && j<idx+4; j++){
        var text = j===idx ? lines[j].replace(anchorRe,"").trim() : lines[j];
        // Strip leading junk symbols (icon/button glyphs OCR misreads as "©", "[]", etc.)
        // BEFORE checking skipLabels — otherwise a stray leading symbol defeats the
        // skipLabels start-anchor and lets a button caption slip through as a "title".
        // Uses stripTitleLeadingJunk() (not a blind `.replace(/^[^A-Za-z]+/, "")`) so a
        // genuine leading year on a trading-card title ("2026 One Piece...") survives —
        // the naive strip treated ALL leading digits as junk and silently ate the year off
        // the front of the title before it ever reached the digit-prefix gate below.
        text = stripTitleLeadingJunk(text);
        // A checkbox/expand icon right next to the thumbnail sometimes OCRs as a single
        // stray LETTER instead of a symbol ("J GTA 6 Sony..." for a title that's really
        // "GTA 6 Sony..."). Real titles essentially never start with an isolated one-letter
        // word other than "A"/"I", so treat any other lone leading UPPERCASE letter+space as
        // the same kind of icon-glyph junk the symbol strip above already handles.
        text = text.replace(/^[B-HJ-Z]\s+(?=[A-Z0-9])/, "");
        // Same glyph, different case, and not always just ONE letter: a lowercase fragment
        // ("a The Legend of Zelda...", "sms Preorder - Gundam TCG...") needs no exception
        // even for "a"/"i" or a short real-looking word — a real eBay title is always
        // properly capitalized, so a genuine leading word would already be uppercase. Capped
        // at 5 characters so this can't ever eat into an actual title word by accident.
        text = text.replace(/^[a-z]{1,5}\s+(?=[A-Z0-9])/, "");
        // A decorative/watermark line ("wah . . . .") can have very few actual junk SYMBOLS
        // (periods are allowed punctuation, not counted as junk) while still being obviously
        // not a title — it just has almost no real words. Real titles always have several;
        // require at least 3 alphabetic runs of 2+ letters before treating this as a
        // candidate at all, so a line that's mostly decoration/spacing can't win by accident
        // just because its low symbol count made it look "clean".
        var realWordCount = (text.match(/[A-Za-z]{2,}/g) || []).length;
        // An alert banner ("This order has a listing with a policy violation. Learn more")
        // is ordinary, grammatically clean English — it has NO stray symbols for the junk
        // check to catch, so on symbol density alone it can look "cleaner" than a genuine
        // title that contains a completely normal "|", "+", or "!!" — checked for by name
        // since these specific banners are already recognized as alerts elsewhere in this
        // function and should never be mistaken for title text regardless of how "clean"
        // they score.
        // The digit gate only rejects short standalone numbers (quantity/price fragments
        // like "2" or "169") — stripTitleLeadingJunk() already preserved a genuine leading
        // year, so a real title reaches here starting with a letter, not a digit.
        if (text.length > 10 && realWordCount >= 3 && !skipLabels.test(text) &&
            !/^\$/.test(text) && !SHORT_LEADING_NUMBER_RE.test(text) && !/^Item ID/i.test(text) && !/policy violation|authenticity guarantee/i.test(text)){
          var full = text;
          var next = lines[j+1];
          // Only glue a wrapped second line on when the primary candidate actually looks
          // incomplete (short, or trailing a dangling connector like "|"/"-"/"&"). Without
          // this, an already-complete single-line title picks up unrelated short text right
          // after it — e.g. a "Shipped Getanotherlabel Order" status line — just because that
          // fragment happens to satisfy the shape check (short, capitalized, not a skip-label).
          var looksIncomplete = text.length < 50 || /[|&-]\s*$/.test(text);
          if (looksIncomplete && next && next.length <= 30 && next.length > 1 && !skipLabels.test(next) &&
              !/^\$/.test(next) && !SHORT_LEADING_NUMBER_RE.test(next) && !/^Item ID/i.test(next) && /^[\p{Lu}]/u.test(next)){
            full = full + " " + next;
          }
          var cleaned = cleanTitle(full);
          var score = junkRatio(cleaned);
          if (!best || score < best.junk){ best = { text: cleaned, junk: score }; }
          // Stop as soon as a candidate is clean enough, instead of always scanning the
          // WHOLE window and picking whichever line scores lowest overall. That "keep
          // comparing" approach is exactly what let a policy-violation banner two lines
          // later win over the real title sitting right here: ordinary clean prose will
          // often score lower than a genuine title with completely normal punctuation, so
          // letting the scan run past a title that's already good enough invites exactly
          // this kind of unrelated-but-cleaner-looking text to take over. A real title
          // scores well under this bar; anything this clean is treated as done.
          if (score <= 0.15) return best;
        }
      }
      return best;
    }
    // The title appears TWICE on this page: once as the page heading ("Order details"),
    // once in the line-item row ("Items"). These are NOT equally reliable — the item row
    // sits next to a thumbnail, an icon, and table columns (quantity/price/ID), all of which
    // OCR routinely glues onto it, while the page heading is comparatively clean prose. This
    // used to run both, score each with the same symbol-density check, and take whichever
    // scored lower — which sounds reasonable but isn't: a garbled item-row fragment can
    // easily contain FEWER penalized characters than a genuine title with completely normal
    // punctuation ("DON!!", a "|"), by pure chance, and there is no version of that scoring
    // formula that can't occasionally be won by noise. Every real title-picker bug this
    // session traces back to either that comparison, or to "Order details" itself grabbing
    // the wrong line — never to "Items" being needed to rescue a genuinely bad "Order
    // details" read. So "Order details" is now trusted outright whenever it finds anything,
    // and "Items" is used only as a fallback when it finds nothing at all — never as a
    // second opinion to out-vote it.
    var candA = titleCandidate(/^order details\b/i);
    var candB = titleCandidate(/^items?\b/i);
    var itemTitle = candA ? candA.text : (candB ? candB.text : null);
    // Kept as a VALIDATION signal only, not a selection mechanism — if the two independent
    // readings share almost no words, that's still worth flagging for a human glance even
    // though the "Order details" one is always what gets used.
    var itemTitleLowAgreement = false;
    if (candA && candB){
      var wA = candA.text.toLowerCase().split(/\W+/).filter(function(w){return w.length>2;});
      var wB = candB.text.toLowerCase().split(/\W+/).filter(function(w){return w.length>2;});
      var shared = wA.filter(function(w){return wB.indexOf(w)>=0;}).length;
      var smaller = Math.min(wA.length, wB.length) || 1;
      if (shared / smaller < 0.4) itemTitleLowAgreement = true;
    }

    var qtyMatch = whole.match(/Quantity\D{0,15}(\d+)/i);
    var quantity = qtyMatch ? parseInt(qtyMatch[1],10) : 1;

    // eBay's numeric item ID (e.g. "Item ID: 167560313453") is a far more reliable product
    // match key than the title text: it's an exact, unambiguous number instead of a run of
    // words that has to be fuzzy-matched against other titles (matchProduct's word-overlap
    // scoring already had one real false-positive this session from two titles sharing
    // generic words like "preorder"/"anniversary"). Stored on the product the first time it's
    // scanned so every later scan of the same listing can match on this instead of guessing
    // from title text.
    var itemIdMatch = whole.match(/Item ID:?\s*(\d{9,14})/i);
    var itemId = itemIdMatch ? itemIdMatch[1] : null;

    return {
      orderNumber: orderNumber,
      salesRecordNo: salesRecordNo,
      buyerName: buyerName,
      buyerUsernameLowConfidence: buyerUsernameLowConfidence,
      // "Sold" and "Buyer paid" used to both be extracted, but on every real order seen this
      // session they're always the identical date (payment happens at sale time on eBay), and
      // the rest of the app already only ever consumed one of them via a fallback chain — two
      // separate OCR reads of the same underlying date doubled the failure surface (either one
      // misreading a digit would fire a "these don't match" flag) for zero real information.
      // Keeping just "Buyer paid" since it's the one that actually matters for settlement
      // tracking (when the money moved), and dropping the redundant "Sold" extraction/check.
      buyerPaidDate: parseLooseDate(valueAfter(/Buyer paid/i, /[A-Z][a-z]{2,8}\.?\s+\d{1,2},?\s*\d{4}/)),
      shipByDate: parseLooseDate(valueAfter(/Ship by/i, /[A-Z][a-z]{2}\.?\s+\d{1,2}/)),
      deliveredDate: parseLooseDate(valueAfter(/Delivered on/i, /[A-Z][a-z]{2}\.?\s+\d{1,2}/)),
      items: (itemTitle || itemId) ? [{ title: itemTitle, quantity: quantity, itemPrice: subtotal, itemTotal: subtotal, itemId: itemId }] : [],
      itemTitleLowAgreement: itemTitleLowAgreement,
      subtotal: subtotal,
      subtotalRaw: subtotalRaw,
      subtotalComputed: subtotalComputed,
      subtotalConflict: subtotalConflict,
      shippingChargedToBuyer: shippingChargedToBuyer,
      salesTax: salesTax,
      orderTotal: orderTotal,
      transactionFees: transactionFees,
      shippingLabelCost: shippingLabelCost,
      otherFees: otherFees,
      discount: discount,
      orderEarnings: orderEarnings,
      orderEarningsRaw: orderEarningsRaw,
      earningsConflict: earningsConflict,
      earningsComputed: earningsComputed,
      fundsStatus: fundsStatus,
      alerts: alerts,
      rawText: text
    };
  }

  // ---------- verification layer ----------
  // A second, independent pass over the ALREADY-EXTRACTED fields: not "did the regex match
  // something" but "does what it matched actually make sense, on its own and against the
  // other fields on the same order." Every OCR-parsing bug fixed this session was caught by
  // a human eyeballing the review modal against the real screenshot — this exists so far
  // fewer of them need a human to catch them first. Returns a flat list of
  // {field, severity, message}; severity "error" = should not be saved without a look,
  // "warn" = worth a glance but plausible as-is.
  function validateExtraction(extracted){
    var flags = [];
    function flag(field, severity, message){ flags.push({ field: field, severity: severity, message: message }); }
    if (!extracted) return flags;

    if (!extracted.buyerName){
      flag("buyerName", "error", "No buyer username was read at all.");
    } else {
      // Buyer identity is the eBay USERNAME (see the comment where it's extracted) — real
      // eBay usernames are lowercase, at least 3 characters, and only ever contain letters,
      // digits, underscore, hyphen, or period. Anything outside that shape (a space, an
      // unexpected symbol) means something other than a clean username got captured.
      if (extracted.buyerName.length < 3){
        flag("buyerName", "warn", "Buyer username is very short (\""+extracted.buyerName+"\") — may be truncated.");
      }
      if (!/^[a-z0-9_.\-]+$/.test(extracted.buyerName)){
        flag("buyerName", "warn", "Buyer username (\""+extracted.buyerName+"\") contains characters a real eBay username wouldn't — likely OCR noise mixed in.");
      }
      if (extracted.buyerUsernameZoomConflict){
        flag("buyerName", "error", "Buyer username is genuinely ambiguous: the original read (\""+extracted.buyerUsernameZoomConflict.original+"\") and a zoomed-in re-read (\""+extracted.buyerUsernameZoomConflict.zoomed+"\") disagree, and both had to be reconstructed from a multi-underscore username OCR misread as separate words. Check this one by hand against the screenshot before saving.");
      } else if (extracted.buyerUsernameLowConfidence){
        flag("buyerName", "warn", "Buyer username (\""+extracted.buyerName+"\") was reconstructed from multiple words that OCR likely split apart at underscores — double-check it against the screenshot.");
      }
    }

    if (!extracted.items || !extracted.items.length || !extracted.items[0].title){
      flag("item", "error", "No item title was read at all.");
    } else {
      if (extracted.items[0].title.length < 6){
        flag("item", "warn", "Item title looks unusually short (\""+extracted.items[0].title+"\") — may be truncated.");
      }
      if (extracted.itemTitleLowAgreement){
        flag("item", "warn", "The title found at the page heading and the title found in the item row don't share much in common — one of them may have grabbed the wrong text.");
      }
      // Downgraded from "error" to "warn" after a real false alarm: unlike the buyer-username
      // conflict (which only fires after a substring/confidence-based reconciliation already
      // failed to resolve it — see reconcileUsername), there's no equivalent way to tell which
      // of two well-formed, disagreeing numeric reads is more trustworthy here, so a
      // magnified-crop re-read that happens to introduce ITS OWN noise on an already-correct
      // main-pass read produces exactly this flag with nothing actually wrong. "Error" implied
      // "don't save without checking" for a field that was already right — a gentler heads-up
      // is the honest signal level given what this check can and can't actually tell.
      if (extracted.itemIdZoomConflict){
        flag("item", "warn", "Item ID has two disagreeing reads: the original (\""+extracted.itemIdZoomConflict.original+"\") and a zoomed-in re-read (\""+extracted.itemIdZoomConflict.zoomed+"\"). Since this is an exact-match product key, worth a glance against the screenshot — but a disagreement here doesn't necessarily mean the displayed one is wrong.");
      }
      // Flag-not-overwrite: a real disagreement between the directly-read Subtotal and the
      // one computed from Order total/Shipping/Sales tax — NOT auto-corrected, since Shipping
      // itself has shown the same dropped-digit misread this check exists to catch, which
      // once made this exact mechanism overwrite an ALREADY-CORRECT Subtotal with a wrong
      // computed one. Neither side is presumed right; surfaced for a human to settle by eye.
      if (extracted.subtotalConflict){
        flag("item", "warn", "Sold price is ambiguous: the OCR'd \"Subtotal\" ($"+extracted.subtotalConflict.original.toFixed(2)+") doesn't reconcile with Order total minus shipping and sales tax ($"+extracted.subtotalConflict.computed.toFixed(2)+"). Either could be the wrong one — check against the screenshot before saving.");
      }
    }

    if (!extracted.orderNumber){
      flag("orderNumber", "warn", "No order number was read — you'll need to enter it manually if you want to track it.");
    } else if (!/^\d{2}-\d{5}-\d{5}$/.test(extracted.orderNumber)){
      flag("orderNumber", "warn", "Order # \""+extracted.orderNumber+"\" doesn't match eBay's usual XX-XXXXX-XXXXX format — OCR may have dropped a digit. Check it against the screenshot.");
    } else if (extracted.orderNumberZoomConflict){
      // Same downgrade and for the same reason as the Item ID conflict above.
      flag("orderNumber", "warn", "Order # has two disagreeing reads: the original (\""+extracted.orderNumberZoomConflict.original+"\") and a zoomed-in re-read (\""+extracted.orderNumberZoomConflict.zoomed+"\"). Worth a glance — but a disagreement here doesn't necessarily mean the displayed one is wrong.");
    }

    // `earningsConflict` means the directly-read "Order earnings" and the orderTotal-minus-fees
    // computed value disagreed at extraction time. Unlike Subtotal's equivalent conflict (which
    // CAN reach here still unresolved — findBreakdownCulprit() has a genuine "stayed ambiguous"
    // outcome), scanScreenshot()'s earnings-conflict resolution always ends by clearing this
    // flag one way or another (zoom confirms computed → trust computed; zoom doesn't → verify
    // Transaction fees/Shipping label independently, correcting whichever one explains it, or
    // falling back to computed if both check out clean) — a deliberate choice, since re-reading
    // the tiny "Order earnings" line under magnification has proven no more reliable than the
    // original read, so there's no real "third opinion" left to wait on for this specific field.
    // In practice this means a real scan should never reach this branch with the flag still
    // set; it stays here as a defensive fallback in case that resolution step doesn't run at
    // all (e.g. an exception earlier in scanScreenshot, or the "Order earnings" line not found
    // on the page for the zoom crop).
    if (extracted.earningsConflict){
      flag("orderEarnings", "warn", "Net profit is ambiguous: the OCR'd \"Order earnings\" ($"+extracted.earningsConflict.original.toFixed(2)+") doesn't reconcile with Order total minus fees ($"+extracted.earningsConflict.computed.toFixed(2)+"). Either could be the wrong one — check against the screenshot before saving.");
    }
    if (extracted.orderEarnings != null && extracted.orderEarnings < 0){
      flag("orderEarnings", "error", "Net profit computed as negative ($"+extracted.orderEarnings.toFixed(2)+") — fees may have been misread.");
    }
    // Bounded against ORDER TOTAL, not the item subtotal — subtotal excludes shipping the
    // buyer paid, which is real revenue that flows into earnings too, so netting MORE than
    // the item price alone (e.g. sold for $134.99, netted $142.30 because shipping revenue
    // exceeded the transaction fee) is completely normal and must never be flagged. Order
    // total is the right ceiling: eBay's own math only ever SUBTRACTS fees from it on the way
    // to earnings, so earnings exceeding order total should never legitimately happen. On the
    // low end, transaction fees on this kind of sale essentially never eat more than half the
    // order total, so a much lower ratio than that is a strong signal a fee got misread as
    // too large — kept generous (not tighter) to avoid nagging on genuinely fee-heavy or
    // high-tax orders.
    if (extracted.orderEarnings != null && extracted.orderTotal != null){
      if (extracted.orderEarnings > extracted.orderTotal + 0.02){
        flag("orderEarnings", "error", "Net profit ($"+extracted.orderEarnings.toFixed(2)+") is more than the order total ($"+extracted.orderTotal.toFixed(2)+") — fees can only subtract from the total, so this can't be right.");
      } else if (extracted.orderEarnings < extracted.orderTotal * 0.4){
        flag("orderEarnings", "warn", "Net profit ($"+extracted.orderEarnings.toFixed(2)+") is under 40% of the order total ($"+extracted.orderTotal.toFixed(2)+") — unusually low for eBay fees; a fee amount may have been misread as too large.");
      }
    }

    var todayStr = new Date().toISOString().slice(0,10);
    if (extracted.buyerPaidDate && extracted.buyerPaidDate > todayStr){
      flag("buyerPaidDate", "warn", "Buyer paid date ("+extracted.buyerPaidDate+") is in the future — likely a misread digit.");
    }

    if (extracted.subtotal != null && extracted.orderTotal != null && extracted.orderTotal + 0.01 < extracted.subtotal){
      flag("orderTotal", "warn", "Order total ($"+extracted.orderTotal.toFixed(2)+") is less than the item subtotal ($"+extracted.subtotal.toFixed(2)+") before adding shipping/tax — check both figures.");
    }

    if (!extracted.fundsStatus || extracted.fundsStatus === "unknown"){
      flag("fundsStatus", "warn", "Funds status couldn't be determined — defaulting to \"Pending payout\". Confirm against the screenshot before marking this paid out.");
    }

    return flags;
  }

  // Compares two INDEPENDENT extractions of the same screenshot (e.g. two OCR passes run
  // with different image preprocessing) and flags every field where they disagree. Two
  // regex-parsers running on two different OCR outputs landing on the exact same value for a
  // field is real, independent evidence that field is probably right — landing on different
  // values means at least one of them is wrong, which a single pass can never tell you by
  // itself.
  function diffExtractions(a, b){
    var flags = [];
    if (!a || !b) return flags;
    function norm(v){ return v==null ? null : String(v).trim().toLowerCase(); }
    function cmp(field, label){
      var av = norm(a[field]), bv = norm(b[field]);
      // Only a real disagreement counts — one pass failing to read a field while the other
      // succeeds is "single-source", not a conflict, and flagging it would just be noise on
      // every order where one pass does slightly better than the other (the normal case).
      if (av==null || bv==null) return;
      if (av !== bv){
        flags.push({ field: field, severity: "warn", message: label+" disagrees between the two OCR readings: \""+(a[field]==null?"(nothing)":a[field])+"\" vs \""+(b[field]==null?"(nothing)":b[field])+"\"." });
      }
    }
    cmp("orderNumber", "Order #");
    cmp("buyerName", "Buyer username");
    cmp("fundsStatus", "Funds status");
    // Net profit is deliberately NOT compared here. Unlike the fields above, `a.orderEarnings`
    // (from the main pass) has already been through a dedicated, strictly more rigorous
    // verification pipeline by this point (see the earningsConflict zoom + fee-culprit-search
    // logic in scanScreenshot) that cross-checks it against independently-read Order
    // total/Sales tax/Transaction fees/Shipping label — real arithmetic, not just "did a second
    // OCR pass happen to agree." `b` (the second pass) never goes through that same pipeline,
    // so it's just raw, uncorrected OCR of the single most digit-loss-prone number on the page.
    // Comparing a verified value against an unverified one produces exactly a false positive in
    // the success case: confirmed for real on the canonical test order, where `a.orderEarnings`
    // was correctly resolved to $11.64 but `b.orderEarnings` independently misread the same line
    // as "$10.64" (yet a third distinct misread, on top of `a`'s own original "$1.64" and a
    // zoomed re-read's "$10.64") — this comparison would have flagged "11.64 vs 10.64" as a
    // disagreement even though 11.64 is already the verified, correct answer.
    // Title needs a WORD-OVERLAP comparison here, not exact match — unlike a username or a
    // dollar figure, which really should read identically on both passes when both are good,
    // a long title string picks up superficial OCR noise even when both passes clearly found
    // the same real product. Seen for real: pass A correctly read the full clean title while
    // pass B (the other image preprocessing) found a worse, truncated reading of the same
    // item-row text with junk glued onto the front — exact-match flagged that as a
    // disagreement even though the title actually shown (pass A's) was already right, which
    // is just noise. Only flag when the two titles barely share any real words at all.
    var at = a.items && a.items[0] ? a.items[0].title : null;
    var bt = b.items && b.items[0] ? b.items[0].title : null;
    if (norm(at) != null && norm(bt) != null && norm(at) !== norm(bt)){
      var atWords = norm(at).split(/\W+/).filter(function(w){return w.length>2;});
      var btWords = norm(bt).split(/\W+/).filter(function(w){return w.length>2;});
      var sharedWords = atWords.filter(function(w){return btWords.indexOf(w)>=0;}).length;
      var smallerCount = Math.min(atWords.length, btWords.length) || 1;
      if (sharedWords / smallerCount < 0.4){
        flags.push({ field: "item", severity: "warn", message: "Item title disagrees between the two OCR readings: \""+at+"\" vs \""+bt+"\"." });
      }
    }
    // Item ID has no on-page redundancy to check itself against (unlike order number, which
    // at least has a known format to validate) and is now an EXACT-match key with no fuzzy
    // tolerance — a single digit swapped by OCR (seen for real: "167564602795" read where the
    // page actually says "147564602795") silently fails to match an already-known product,
    // with no format check able to catch it since a wrong ID is still perfectly well-formed.
    // The two independently-preprocessed passes disagreeing on it is the only signal
    // available that something's off.
    var aid = a.items && a.items[0] ? a.items[0].itemId : null;
    var bid = b.items && b.items[0] ? b.items[0].itemId : null;
    if (norm(aid) != null && norm(bid) != null && norm(aid) !== norm(bid)){
      flags.push({ field: "item", severity: "warn", message: "Item ID disagrees between the two OCR readings: \""+aid+"\" vs \""+bid+"\" — check it against the screenshot before saving, since a wrong ID can silently mismatch this to the wrong product later." });
    }
    return flags;
  }

  // ---------- icons (line-style, SF-Symbol-ish; no emoji anywhere in the UI) ----------
  var ICON_PATHS = {

  function $(sel, root){ return (root||document).querySelector(sel); }
  function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function money(n){ var v=Number(n||0); var s=v<0?"-":""; return s+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtDate(iso){ if(!iso) return "—"; var d=new Date(iso+"T00:00:00"); if(isNaN(d)) return "—"; return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
  function daysUntil(iso){ if(!iso) return null; var t=new Date(todayISO()+"T00:00:00"); var d=new Date(iso+"T00:00:00"); if(isNaN(d)) return null; return Math.round((d-t)/86400000); }

  function productById(id){ return state.products.find(function(p){ return p.id===id; }); }

  // ---------- persistence layer ----------
  function subscribeCollections(){
    function sub(name, target){
      db.collection(name).orderBy("createdAt","asc").onSnapshot(function(snap){
        state[target] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, function(e){
        if (e.code === "revoked"){ showSyncBanner("Live sync stopped for this session — reload the page to reconnect.", true); }
        else { console.warn("db error", target, e); }
      });
    }
    sub("products","products");
    sub("batches","batches");
    sub("sales","sales");
    sub("settlements","settlements");
  }

  function localAdd(collection, data){
    var id = uid();
    state[collection] = state[collection].concat([Object.assign({id:id}, data)]);
    render();
    return Promise.resolve(id);
  }
  function localUpdate(collection, id, patch){
    state[collection] = state[collection].map(function(r){ return r.id===id ? Object.assign({}, r, patch) : r; });
    render();
    return Promise.resolve();
  }
  function localDelete(collection, id){
    state[collection] = state[collection].filter(function(r){ return r.id!==id; });
    render();
    return Promise.resolve();
  }

  function addProduct(data){
    data = Object.assign({ createdBy: whoAmI, createdAt: Date.now() }, data);
    return db ? db.collection("products").add(data) : localAdd("products", data);
  }
  function addBatch(data){
    data = Object.assign({ createdBy: whoAmI, createdAt: Date.now() }, data);
    return db ? db.collection("batches").add(data) : localAdd("batches", data);
  }
  function updateBatch(id, patch){
    return db ? db.doc("batches/"+id).update(patch) : localUpdate("batches", id, patch);
  }
  function deleteBatch(id){
    return db ? db.doc("batches/"+id).delete() : localDelete("batches", id);
  }
  function addSale(data){
    data = Object.assign({ createdBy: whoAmI, createdAt: Date.now() }, data);
    return db ? db.collection("sales").add(data) : localAdd("sales", data);
  }
  function updateSale(id, patch){
    return db ? db.doc("sales/"+id).update(patch) : localUpdate("sales", id, patch);
  }
  function deleteSale(id){
    return db ? db.doc("sales/"+id).delete() : localDelete("sales", id);
  }
  function addSettlement(data){
    data = Object.assign({ createdBy: whoAmI, createdAt: Date.now() }, data);
    return db ? db.collection("settlements").add(data) : localAdd("settlements", data);
  }
  function deleteSettlement(id){
    return db ? db.doc("settlements/"+id).delete() : localDelete("settlements", id);
  }

  // ---------- derived data ----------
  // Only sales whose payout has actually landed (lifecycleStatus !== "pending") count toward
  // the real, collectible balance — Jax can't hand Jon money eBay hasn't released to him yet.
  // A preorder sale can sit "pending" for months (sold now, shipped and paid out later), so
  // folding it into the same number as already-settled cash overstates what's actually
  // available to pay out today. Settlements (real cash already exchanged) always net against
  // this pool — there's nothing else they could have been drawn from.
  function computeBalance(){
    var bal = 0;
    state.sales.forEach(function(s){ if (s.attributedTo === "Jon" && s.lifecycleStatus !== "pending") bal += Number(s.netProfit||0); });
    state.settlements.forEach(function(t){
      if (t.from === "Jax" && t.to === "Jon") bal -= Number(t.amount||0);
      else if (t.from === "Jon" && t.to === "Jax") bal += Number(t.amount||0);
    });
    return bal;
  }
  // The flip side: money tied up in sales that haven't paid out yet. Real, eventually-owed
  // money — just not anything Jax could actually hand over right now. Shown separately so
  // "how much can we actually settle today" and "how much is still coming" never get blurred
  // into one misleading number.
  function pendingBalance(){
    var bal = 0, count = 0;
    state.sales.forEach(function(s){ if (s.attributedTo === "Jon" && s.lifecycleStatus === "pending"){ bal += Number(s.netProfit||0); count++; } });
    return { amount: bal, count: count };
  }
  // bal > 0 means Jax owes Jon. Phrased from `viewer`'s own point of view, not third-person.
  function balanceLine(bal, viewer){
    var other = viewer === "Jon" ? "Jax" : "Jon";
    if (Math.abs(bal) < 0.005) return { text:"You're all settled up", tone:"even" };
    var jonIsOwed = bal > 0;
    var viewerIsOwed = (viewer === "Jon") === jonIsOwed;
    var amount = money(Math.abs(bal));
    if (viewerIsOwed) return { text: other+" owes you "+amount, tone:"owed" };
    return { text:"You owe "+other+" "+amount, tone:"owe" };
  }
  function stockFor(productId){
    var received = 0, pipeline = 0;
    state.batches.forEach(function(b){ if(b.productId===productId){ if(b.status==="received") received += Number(b.quantity||0); else pipeline += Number(b.quantity||0); } });
    var sold = 0;
    state.sales.forEach(function(s){ if(s.productId===productId) sold += Number(s.quantitySold||0); });
    return { received: received, pipeline: pipeline, sold: sold, remaining: received - sold };
  }
  // Auto-covers a sale against inventory instead of ever letting "On hand" go negative. Jon's
  // real workflow is scan-the-sale-first, no separate purchase-batch entry — which meant every
  // product's stock count was permanently wrong (negative "On hand") because nothing had ever
  // been logged as received. Rather than requiring a second manual step every time, this treats
  // "I sold N of these" as proof that at least N were physically in hand: whenever a sale is
  // saved, recompute the product's total received vs. total sold (INCLUDING this sale) and, if
  // sold now exceeds received, auto-create a batch for exactly the shortfall so the books
  // balance to zero (never negative) instead of drifting further under. The owner is taken from
  // the sale's own "Goes to" field (the best signal available for who actually had the stock,
  // mirroring how suggestOwner() already uses batch ownership to guess sale ownership in the
  // OTHER direction), unit cost defaults to $0 since it's genuinely unknown, and needsReview is
  // set so it surfaces in the existing "needs review" banner/badge — this auto-fill is a
  // placeholder for real batch data, not a claim that the item was actually free.
  // `excludeSaleId` lets an edit recompute cleanly by not double-counting the sale's own old
  // quantity against itself.
  function syncStockForSale(productId, quantitySold, attributedTo, saleDate, excludeSaleId){
    if (!productId) return Promise.resolve();
    var totalSold = Number(quantitySold||0);
    state.sales.forEach(function(s){
      if (s.productId === productId && s.id !== excludeSaleId) totalSold += Number(s.quantitySold||0);
    });
    var totalReceived = 0;
    state.batches.forEach(function(b){ if (b.productId === productId && b.status === "received") totalReceived += Number(b.quantity||0); });
    var shortfall = totalSold - totalReceived;
    if (shortfall <= 0) return Promise.resolve();
    return addBatch({
      productId: productId, owner: attributedTo || whoAmI, quantity: shortfall, unitCost: 0,
      status: "received", receivedDate: saleDate || todayISO(),
      note: "Auto-added to cover a sale — unit cost unknown, edit with the real purchase cost if you have it.",
      needsReview: true
    });
  }
  function totalNetProfit(){ return state.sales.reduce(function(a,s){ return a+Number(s.netProfit||0); },0); }
  function preorderBatches(){ return state.batches.filter(function(b){ return b.status!=="received"; }); }
  function cashTiedUp(owner){
    return preorderBatches().filter(function(b){ return b.owner===owner; })
      .reduce(function(a,b){ return a + Number(b.quantity||0)*Number(b.unitCost||0); },0);
  }
  function needsReviewBatches(){ return state.batches.filter(function(b){ return !!b.needsReview; }); }
  function pendingProfit(){ return state.sales.filter(function(s){ return s.lifecycleStatus==="pending"; }).reduce(function(a,s){ return a+Number(s.netProfit||0); },0); }

  // Generic marketplace/listing words that show up across totally unrelated products and
  // shouldn't count as evidence of a match on their own (e.g. "Preorder Gundam TCG 1st
  // Anniversary Set English" vs "The Legend of Zelda 40th Anniversary ... - Preorder" share
  // "preorder" and "anniversary" despite being different items entirely).
  var GENERIC_PRODUCT_WORDS = /^(the|and|for|with|preorder|presale|order|anniversary|edition|bundle|series|item|sale|new|set)$/i;
  function matchProduct(title, itemId){
    // eBay's own numeric item ID is an exact, unambiguous match key — check it first and
    // skip the fuzzy title heuristics entirely when it hits. This is what actually fixes the
    // class of bug the word-overlap scoring below can only ever patch one collision at a
    // time (two titles sharing enough generic words to look related when they aren't).
    if (itemId){
      var byId = state.products.find(function(p){ return p.itemId && p.itemId === itemId; });
      if (byId) return byId;
    }
    if (!title) return null;
    var t = title.toLowerCase();
    var best = null, bestScore = 0;
    state.products.forEach(function(p){
      var pt = p.name.toLowerCase();
      var score = 0;
      if (t === pt) score = 100;
      else if (t.indexOf(pt) >= 0 || pt.indexOf(t) >= 0) score = 60;
      else {
        var wordsA = pt.split(/\W+/).filter(function(w){ return w.length>2 && !GENERIC_PRODUCT_WORDS.test(w); });
        var wordsB = t.split(/\W+/).filter(function(w){ return w.length>2 && !GENERIC_PRODUCT_WORDS.test(w); });
        var common = wordsA.filter(function(w){ return wordsB.indexOf(w)>=0; });
        // require the overlap to cover most of the shorter product name's distinctive
        // words, not just hit an arbitrary count — otherwise two long, mostly-different
        // titles can still rack up 2+ incidental shared words.
        score = (wordsA.length && common.length/wordsA.length >= 0.5) ? common.length : 0;
      }
      if (score > bestScore){ bestScore = score; best = p; }
    });
    return bestScore >= 2 ? best : null;
  }

  function suggestOwner(productId){
    if (!productId) return whoAmI;
    var batches = state.batches.filter(function(b){ return b.productId===productId; });
    var jonQty = batches.filter(function(b){ return b.owner==="Jon"; }).reduce(function(a,b){ return a+Number(b.quantity||0); },0);
    var jaxQty = batches.filter(function(b){ return b.owner==="Jax"; }).reduce(function(a,b){ return a+Number(b.quantity||0); },0);
    if (!jonQty && !jaxQty) return whoAmI;
    if (!jonQty) return "Jax";
    if (!jaxQty) return "Jon";
    var jonSold = state.sales.filter(function(s){ return s.productId===productId && s.attributedTo==="Jon"; })
      .reduce(function(a,s){ return a+Number(s.quantitySold||0); },0);
    return jonSold < jonQty ? "Jon" : "Jax";
  }

  function findByOrderNumber(orderNumber){
    if (!orderNumber) return null;
    return state.sales.find(function(s){ return s.orderNumber && s.orderNumber===orderNumber; }) || null;
  }
  function findBySalesRecordNo(salesRecordNo){
    if (!salesRecordNo) return null;
    return state.sales.find(function(s){ return s.salesRecordNo && s.salesRecordNo===salesRecordNo; }) || null;
  }
  function findSoftDuplicate(buyerName, productId, saleDate){
    if (!buyerName || !productId) return null;
    var target = saleDate ? new Date(saleDate+"T00:00:00").getTime() : null;
    return state.sales.find(function(s){
      if (!s.buyerName || s.buyerName.toLowerCase()!==buyerName.toLowerCase()) return false;
      if (s.productId!==productId) return false;
      if (!target || !s.saleDate) return true;
      var d = Math.abs(new Date(s.saleDate+"T00:00:00").getTime()-target);
      return d <= 3*86400000;
    }) || null;
  }

  // ---------- rendering ----------
  function setTab(t){ tab = t; render(); }

  function render(){
    document.querySelectorAll(".navbtn").forEach(function(b){ b.classList.toggle("active", b.dataset.tab===tab); });
    var titles = { overview:"Overview", inventory:"Inventory", preorders:"Preorders", orders:"Orders", sales:"Sales", settlements:"Settlements" };
    $("#pageTitle").innerHTML = "<h1>"+titles[tab]+"</h1>";
    renderReviewBanner();
    var main = $("#main");
    if (tab==="overview") main.innerHTML = renderOverview();
    else if (tab==="inventory") main.innerHTML = renderInventory();
    else if (tab==="preorders") main.innerHTML = renderPreorders();
    else if (tab==="orders") main.innerHTML = renderOrders();
    else if (tab==="sales") main.innerHTML = renderSales();
    else if (tab==="settlements") main.innerHTML = renderSettlements();
    paintIcons();
  }

  function renderReviewBanner(){
    var n = needsReviewBatches().length;
    var b = $("#reviewBanner");
    if (!n){ b.innerHTML=""; return; }
    b.innerHTML = "<div class='banner'><span class='ic' data-icon='warning'></span><span>"+n+" batch"+(n>1?"es":"")+" "+(n>1?"were":"was")+" auto-added to cover a sale and need"+(n>1?"":"s")+" a real purchase cost filled in (defaulted to $0).</span>"+
      "<button data-action='goto-inventory'>Review in Inventory</button></div>";
  }

  function renderOverview(){
    var other = whoAmI === "Jon" ? "Jax" : "Jon";
    var myTied = cashTiedUp(whoAmI), otherTied = cashTiedUp(other);
    var upcoming = preorderBatches().slice().sort(function(a,b){
      if(!a.expectedArrival) return 1; if(!b.expectedArrival) return -1;
      return a.expectedArrival < b.expectedArrival ? -1 : 1;
    }).slice(0,5);

    var html = "";
    html += "<div class='tiles'>";
    var pending = pendingProfit();
    html += "<div class='tile'><div class='eyebrow'>Total profit</div><div class='value'>"+money(totalNetProfit())+"</div><div class='sub'>"+state.sales.length+" sale"+(state.sales.length===1?"":"s")+" logged"+(pending>0.004?" · "+money(pending)+" pending payout":"")+"</div></div>";
    html += "<div class='tile'><div class='eyebrow'>Your preorders</div><div class='value'>"+money(myTied)+"</div><div class='sub'>committed, not in hand yet</div></div>";
    html += "<div class='tile'><div class='eyebrow'>"+other+"'s preorders</div><div class='value'>"+money(otherTied)+"</div><div class='sub'>committed, not in hand yet</div></div>";
    html += "</div>";

    html += "<div class='section-head'><h2>Upcoming arrivals</h2><span class='count'>"+preorderBatches().length+" item(s) in the pipeline</span></div>";
    if (!upcoming.length){
      html += state.batches.length
        ? "<div class='card empty'><div class='ic' data-icon='check'></div>Everything you've ordered has arrived.</div>"
        : "<div class='card empty'><div class='ic' data-icon='preorders'></div>This tracks stock <b>you or Jax have paid to buy</b> and are waiting to receive — add one from Inventory (\"Add batch\", status Preorder). An eBay order you've scanned that happens to be a preorder listing is a different thing (that's a sale, tracked in Sales/Orders) and won't show up here.</div>";
    } else {
      html += "<div class='card table-wrap'><table><thead><tr><th>Item</th><th>Owner</th><th>Qty</th><th>Expected</th><th>Status</th></tr></thead><tbody>";
      upcoming.forEach(function(b){
        var p = productById(b.productId);
        var du = daysUntil(b.expectedArrival);
        var when = b.expectedArrival ? fmtDate(b.expectedArrival) + (du!=null ? (du<0 ? " <span class='badge overdue'>"+Math.abs(du)+"d overdue</span>" : " <span class='hint'>("+du+"d)</span>") : "") : "—";
        html += "<tr><td data-label='Item'>"+esc(p?p.name:"—")+"</td><td data-label='Owner'><span class='badge owner-"+b.owner+"'>"+b.owner+"</span></td><td class='num-cell' data-label='Qty'>"+b.quantity+"</td><td data-label='Expected'>"+when+"</td><td data-label='Status'><span class='badge status-"+b.status+"'>"+STATUS_LABEL[b.status]+"</span></td></tr>";
      });
      html += "</tbody></table></div>";
    }
    return html;
  }

  function renderInventory(){
    var html = "<div class='section-head'><h2>Products</h2><button class='btn primary' data-action='open-add-product'><span class='ic' data-icon='plus'></span> Add item</button></div>";
    if (!state.products.length){
      html += "<div class='card empty'><div class='ic' data-icon='box'></div>No items yet — add the first thing you and Jax are flipping.</div>";
      return html;
    }
    state.products.slice().sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); }).forEach(function(p){
      var stock = stockFor(p.id);
      var batches = state.batches.filter(function(b){ return b.productId===p.id; });
      html += "<div class='card product-card'>";
      html += "<div class='product-head'>";
      html += "<div class='product-title'><h3>"+esc(p.name)+"</h3><span class='cat'>"+esc(p.category||"Other")+"</span></div>";
      html += "<div class='stock-line'><span>Received <b>"+stock.received+"</b></span><span>Sold <b>"+stock.sold+"</b></span><span>On hand <b>"+stock.remaining+"</b></span><span>Incoming <b>"+stock.pipeline+"</b></span></div>";
      html += "</div>";
      if (batches.length){
        html += "<div class='table-wrap'><table><thead><tr><th>Owner</th><th>Qty</th><th>Unit cost</th><th>Total</th><th>Status</th><th>Expected / Received</th><th>Note</th><th></th></tr></thead><tbody>";
        batches.forEach(function(b){
          var du = daysUntil(b.expectedArrival);
          var dateCell = b.status==="received" ? fmtDate(b.receivedDate) : (b.expectedArrival ? fmtDate(b.expectedArrival)+(du!=null&&du<0?" <span class='badge overdue'>late</span>":"") : "—");

  function renderPreorders(){
    var rows = preorderBatches().slice().sort(function(a,b){
      if(!a.expectedArrival) return 1; if(!b.expectedArrival) return -1;
      return a.expectedArrival < b.expectedArrival ? -1 : 1;
    });
    var html = "<div class='section-head'><h2>Preorder pipeline</h2><span class='count'>"+rows.length+" item(s) not yet in hand</span></div>";
    if (!rows.length){
      html += state.batches.length
        ? "<div class='card empty'><div class='ic' data-icon='check'></div>Everything on order has arrived.</div>"
        : "<div class='card empty'><div class='ic' data-icon='preorders'></div>This tracks stock <b>you or Jax have paid to buy</b> and are waiting to receive — add one from Inventory (\"Add batch\", status Preorder). Scanning an eBay order here that happens to be a preorder listing is a different thing (that's a sale, tracked in Sales/Orders) and won't show up in this pipeline.</div>";
      return html;
    }
    html += "<div class='card table-wrap'><table><thead><tr><th>Item</th><th>Owner</th><th>Qty</th><th>Unit cost</th><th>Committed</th><th>Status</th><th>Expected</th><th></th></tr></thead><tbody>";
    rows.forEach(function(b){
      var p = productById(b.productId);
      var du = daysUntil(b.expectedArrival);
      var when = b.expectedArrival ? fmtDate(b.expectedArrival) : "—";
      if (du!=null && du<0) when += " <span class='badge overdue'>"+Math.abs(du)+"d overdue</span>";
      else if (du!=null) when += " <span class='hint'>("+du+"d)</span>";
      html += "<tr><td data-label='Item'>"+esc(p?p.name:"—")+"</td><td data-label='Owner'><span class='badge owner-"+b.owner+"'>"+b.owner+"</span></td>"+
        "<td class='num-cell' data-label='Qty'>"+b.quantity+"</td><td class='num-cell' data-label='Unit cost'>"+money(b.unitCost)+"</td><td class='num-cell' data-label='Committed'>"+money(Number(b.quantity)*Number(b.unitCost))+"</td>"+
        "<td data-label='Status'><span class='badge status-"+b.status+"'>"+STATUS_LABEL[b.status]+"</span></td><td data-label='Expected'>"+when+"</td>"+
        "<td data-label='Actions'><button class='btn small' data-action='mark-received' data-id='"+b.id+"'>Mark received</button></td></tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function renderSettlements(){
    var rows = state.settlements.slice().sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
    var bal = computeBalance();
    var bl = balanceLine(bal, whoAmI);
    var pending = pendingBalance();
    var pendingSub = pending.count
      ? pending.count+" sale"+(pending.count===1?"":"s")+" still shipping / awaiting eBay payout"
      : "Nothing sold right now is still waiting on eBay to pay out.";
    var html = "<div class='tiles'>"+
      "<div class='tile tone-"+bl.tone+"'><div class='eyebrow'>Available to settle now</div><div class='value'>"+esc(bl.text)+"</div><div class='sub'>From sales eBay has already paid out — the money's actually landed.</div></div>"+
      "<div class='tile'><div class='eyebrow'>Pending payout</div><div class='value'>"+money(pending.amount)+"</div><div class='sub'>"+esc(pendingSub)+" — not collectible until then.</div></div>"+
      "</div>";
    html += "<div class='section-head'><h2>Payment history</h2><button class='btn primary' data-action='open-add-settlement'><span class='ic' data-icon='plus'></span> Record payment</button></div>";
    if (!rows.length){ html += "<div class='card empty'><div class='ic' data-icon='settlements'></div>No payments logged between you two yet.</div>"; return html; }
    html += "<div class='card table-wrap'><table><thead><tr><th>Date</th><th>From</th><th>To</th><th>Amount</th><th>Note</th><th></th></tr></thead><tbody>";
    rows.slice().reverse().forEach(function(t){
      html += "<tr><td data-label='Date'>"+fmtDate(t.date)+"</td><td data-label='From'><span class='badge owner-"+t.from+"'>"+t.from+"</span></td><td data-label='To'><span class='badge owner-"+t.to+"'>"+t.to+"</span></td>"+
