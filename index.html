    var primaryItemId = items[0] ? items[0].itemId : null;
    var matchedProduct = matchProduct(primaryTitle, primaryItemId);
    // "Sales record no." (e.g. "104") is a much shorter, simpler number than the order number
    // and far less prone to OCR digit-loss — used as a fallback dedup key so a re-scan of the
    // same order still gets recognized as an update, not a duplicate, even on an order whose
    // number came out wrong or incomplete.
    var matchedSale = findByOrderNumber(extracted.orderNumber) || findBySalesRecordNo(extracted.salesRecordNo);
    var isUpdate = !!matchedSale;
    var pid = matchedSale ? matchedSale.productId : (matchedProduct ? matchedProduct.id : null);
    var suggested = matchedSale ? matchedSale.attributedTo : suggestOwner(pid);
    var fundsStatus = extracted.fundsStatus==="available" ? "completed" : "pending";
    if (matchedSale && matchedSale.lifecycleStatus==="completed") fundsStatus = "completed";

    var soft = (!isUpdate && pid) ? findSoftDuplicate(extracted.buyerName, pid, extracted.buyerPaidDate) : null;

    var qty = matchedSale ? matchedSale.quantitySold : (items[0] ? items[0].quantity : 1);
    // Fresh extraction first, matchedSale only as a fallback — matches profit/buyer/orderNum
    // right below, and for the same reason: this is a money value OCR can get wrong (or
    // simply fail to read, before the recent fix to the "$"-required subtotal regex) on an
    // EARLIER scan of the same order, saved into matchedSale as null/empty — the OLD
    // (matchedSale-first) order here meant a re-scan could never correct that, silently
    // showing "Sold price" blank forever even after the extraction bug that caused it was
    // fixed, since the stale empty value on the existing record always won.
    var soldPrice = extracted.subtotal!=null ? extracted.subtotal : (items[0]&&items[0].itemTotal!=null ? items[0].itemTotal : (matchedSale ? matchedSale.soldPrice : null));
    var profit = extracted.orderEarnings!=null ? extracted.orderEarnings : (matchedSale ? matchedSale.netProfit : null);
    var buyer = extracted.buyerName || (matchedSale ? matchedSale.buyerName : "");
    var orderNum = extracted.orderNumber || (matchedSale ? matchedSale.orderNumber : "");
    var saleDate = extracted.buyerPaidDate || (matchedSale ? matchedSale.saleDate : todayISO());
    var alerts = (extracted.alerts && extracted.alerts.length) ? extracted.alerts : (matchedSale ? (matchedSale.alerts||[]) : []);

    // Group every verification flag by the field it's about, so each input can show its own
    // specific reason right underneath it instead of leaving the user to map a wall of text
    // in a banner back to the right box themselves.
    var flagsByField = {};
    reviewFlags.forEach(function(f){ (flagsByField[f.field] = flagsByField[f.field]||[]).push(f); });
    function fieldHint(field){
      var fs = flagsByField[field];
      if (!fs || !fs.length) return "";
      var worst = fs.some(function(f){return f.severity==="error";}) ? "error" : "warn";
      return "<div class='hint "+worst+"'>"+fs.map(function(f){return esc(f.message);}).join("<br>")+"</div>";
    }

    var banner = "";
    if (isUpdate){
      banner = "<div class='banner info'><span class='ic' data-icon='link'></span><span>Matches order #"+esc(matchedSale.orderNumber)+" already logged — saving will update it, not duplicate it.</span></div>";
    } else if (soft){
      banner = "<div class='banner'><span class='ic' data-icon='warning'></span><span>Looks similar to an order already logged for "+esc(soft.buyerName)+" — check you're not duplicating <button data-action='view-order' data-id='"+soft.id+"' class='link-btn'>that one</button>.</span></div>";
    }
    if (!extracted.orderNumber && !extracted.buyerName){
      banner += "<div class='banner'><span class='ic' data-icon='info'></span><span>Couldn't auto-read this screenshot — the image is still attached; fill in what you can below.</span></div>";
    }
    // Every field-level hint below is repeated here too, as one itemized list — so nothing
    // requires scrolling through the whole form to notice. A second, independently-processed
    // OCR pass (different image thresholding) is cross-checked against the first here too,
    // not just internal math/format checks.
    var errorCount = reviewFlags.filter(function(f){return f.severity==="error";}).length;
    if (reviewFlags.length){
      banner += "<div class='banner"+(errorCount?" error":"")+"'><span class='ic' data-icon='warning'></span><div>"+
        "<div><b>"+reviewFlags.length+" thing"+(reviewFlags.length>1?"s":"")+" worth a second look before saving"+(errorCount?" — "+errorCount+" look"+(errorCount>1?"":"s")+" likely wrong":"")+".</b></div>"+
        "<ul style='margin:4px 0 0 18px;padding:0;'>"+reviewFlags.map(function(f){return "<li>"+esc(f.message)+"</li>";}).join("")+"</ul>"+
        "</div></div>";
    }

    openModal(isUpdate ? "Update order" : "Review scanned order",
      "<div class='shot-pair'><img src='"+esc(screenshotId)+"' alt='order screenshot' title='Click to enlarge' data-action='zoom-image' data-src='"+esc(screenshotId)+"'></div>"+
      banner+
      "<div class='field'><label>Item</label><select id='f_product'>"+
        "<option value=''"+(!pid?" selected":"")+">"+(primaryTitle?esc(primaryTitle)+" (new item)":"Choose an item…")+"</option>"+
        productOptions(pid)+
      "</select>"+(items.length>1?"<div class='hint'>Plus "+(items.length-1)+" more item(s) in this order.</div>":"")+fieldHint("item")+"</div>"+
      "<div class='field'><label>New item name</label><input id='f_new_title' type='text' value='"+esc(primaryTitle||"")+"' placeholder='Only used if Item above is left as “new item”'></div>"+
      "<div class='row2'><div class='field'><label>Quantity</label><input id='f_qty' type='number' min='1' step='1' value='"+(qty||1)+"'></div>"+
      "<div class='field'><label>Sale date</label><input id='f_date' type='date' value='"+(saleDate||todayISO())+"'>"+fieldHint("buyerPaidDate")+"</div></div>"+
      "<div class='row2'><div class='field'><label>Net profit ($)</label><input id='f_profit' type='number' step='0.01' value='"+(profit!=null?profit:"")+"' placeholder='eBay “Order earnings”'>"+fieldHint("orderEarnings")+"</div>"+
      "<div class='field'><label>Sold price</label><input id='f_price' type='number' step='0.01' value='"+(soldPrice!=null?soldPrice:"")+"'></div></div>"+
      "<div class='row2'><div class='field'><label>Buyer username</label><input id='f_buyer' type='text' value='"+esc(buyer||"")+"'>"+fieldHint("buyerName")+"</div>"+
      "<div class='field'><label>Order #</label><input id='f_ordernum' type='text' value='"+esc(orderNum||"")+"'>"+fieldHint("orderNumber")+
      "</div></div>"+
      "<div class='row2'><div class='field'><label>Goes to</label><select id='f_who'>"+ownerOptions(suggested)+"</select></div>"+
      "<div class='field'><label>Funds status</label><select id='f_funds'>"+
        "<option value='pending'"+(fundsStatus!=="completed"?" selected":"")+">Pending payout</option>"+
        "<option value='completed'"+(fundsStatus==="completed"?" selected":"")+">Completed</option>"+
      "</select>"+fieldHint("fundsStatus")+"</div></div>"+
      "<div class='field'><label>Alerts / notes</label><textarea id='f_note' placeholder='Auto-detected banners (policy violation, Authenticity Guarantee, etc.) show up here — edit freely'>"+esc(alerts.join("; "))+"</textarea></div>"+
      (extracted.rawText ? "<details><summary class='hint' style='cursor:pointer;'>Raw OCR text (for troubleshooting misreads)</summary>"+
        "<button type='button' class='btn ghost' style='margin-top:6px;' data-action='copy-raw-ocr' data-text='"+esc(extracted.rawText)+"'>Copy raw text</button>"+
        "<pre class='raw-ocr'>"+esc(extracted.rawText)+"</pre></details>" : "")+
      "<input type='hidden' id='f_screenshot' value='"+screenshotId+"'>"+
      "<input type='hidden' id='f_matched_sale' value='"+(matchedSale?matchedSale.id:"")+"'>"+
      "<input type='hidden' id='f_extract_ctx' value='"+esc(JSON.stringify({ subtotal: extracted.subtotal, orderTotal: extracted.orderTotal, itemId: primaryItemId, salesRecordNo: extracted.salesRecordNo }))+"'>",
      "<button class='btn' data-action='close-modal'>Cancel</button><button class='btn primary' data-action='submit-scan-review'>"+(isUpdate?"Update order":"Save order")+"</button>",
      { wide:true }
    );
  }

  async function scanScreenshot(file){
    if (!file) return;
    if (!assetsCap){ toast("Screenshot storage isn't set up in this view — use Record sale instead."); return; }

    var uploaded;
    try {
      uploaded = await assetsCap.upload(file);
    } catch(e){
      // "storage/unauthorized" here means Firebase Storage rejected the request as
      // unauthenticated — seen in practice on mobile Safari, where the anonymous auth session
      // established at page load can go stale (e.g. under Private Browsing's restricted
      // IndexedDB, the SDK's background token refresh can silently fail) even though the app
      // still believes it's connected. Since this tracker's data isn't gated by WHICH anonymous
      // identity is signed in (confirmed: a brand new anon session reads the exact same shared
      // Firestore data), a fresh sign-in costs nothing and safely self-heals a dead session —
      // so retry once automatically instead of just telling the user to go fix it themselves.
      if (e && e.code === "storage/unauthorized"){
        try {
          await firebase.auth().signOut();
          var freshCred = await firebase.auth().signInAnonymously();
          assetsCap = makeStorageAdapter(firebase.storage(), freshCred.user.uid);
          uploaded = await assetsCap.upload(file);
        } catch(e2){
          toast("Couldn't store that screenshot ("+(e2&&e2.code||"error")+") — try reloading the page.");
          return;
        }
      } else {
        toast("Couldn't store that screenshot ("+(e&&e.code||"error")+")");
        return;
      }
    }

    scanState = { active:true, label:"Starting OCR engine…" };
    render();

    var extracted = null, reviewFlags = [], confidenceA = null;
    try {
      var worker = await getTessWorker();
      scanState = { active:true, label:"Reading screenshot…" };
      render();
      var imgA = await preprocessForOCR(file, "sharp");
      // Requesting `blocks: true` alongside the default text also returns line-level bounding
      // boxes — needed below for the targeted order-number re-read. This doesn't cost a
      // second OCR pass; it's the same underlying recognition Tesseract already runs, just
      // asking it to also hand back the box data.
      var resultA = await worker.recognize(imgA, {}, { text: true, blocks: true });
      // Cleans both the icon-glyph-before-the-title noise AND a title/next-region gluing
      // problem (see cleanTitleCandidateLine) using Tesseract's own per-word confidence and
      // bounding boxes, BEFORE parseOrderText ever sees the text — fixing the input this way
      // generalizes to whatever shape either problem takes next, instead of adding another
      // text-pattern rule for each new shape either one has taken so far.
      var cleanedTextA = cleanTitleCandidateLine(resultA.data, resultA.data.text || "");
      extracted = parseOrderText(cleanedTextA);
      // Tesseract's own self-reported mean confidence (0-100) for this read — an independent
      // signal from the OCR engine itself, separate from anything this app's own regex
      // logic can infer about the text it produced.
      confidenceA = typeof resultA.data.confidence === "number" ? resultA.data.confidence : null;

      // Order number: this is the primary dedup key (see findBySalesRecordNo/soft-duplicate
      // matching) — a wrong-but-WELL-FORMED digit swap can't be caught by a format check
      // alone, and this exact failure mode is confirmed real on the sibling Item ID field
      // (single digit swap, both readings passed their own format check). So this now always
      // cross-checks against an independent, more-magnified re-read of just that line,
      // instead of only reaching for one when the main read already looks missing/malformed.
      try {
        var lineBbox = findOrderNumberLineBbox(resultA.data);
        if (lineBbox){
          scanState = { active:true, label:"Zooming in on the order number for a cleaner read…" };
          render();
          var cropBlob = await cropAndUpscale(imgA, lineBbox, 5);
          if (cropBlob){
            var cropResult = await worker.recognize(cropBlob);
            var cropMatch = (cropResult.data.text || "").match(/\b\d{2}-\d{5}-\d{5}\b/);
            var zoomedOrderNumber = cropMatch ? cropMatch[0] : null;
            if (extracted){
              if (!extracted.orderNumber || !/^\d{2}-\d{5}-\d{5}$/.test(extracted.orderNumber)){
                // Original was missing or malformed — accept the zoom outright if it's
                // well-formed, same policy as before.
                if (zoomedOrderNumber) extracted.orderNumber = zoomedOrderNumber;
              } else if (zoomedOrderNumber && zoomedOrderNumber !== extracted.orderNumber){
                // Both readings are well-formed but land on DIFFERENT digits — text alone
                // can't tell which is right, so don't silently pick one. Keep the original,
                // flag both for a human to settle against the screenshot.
                extracted.orderNumberZoomConflict = { original: extracted.orderNumber, zoomed: zoomedOrderNumber };
              }
            }
          }
        }
      } catch(e){ console.warn("Order-number zoom re-read failed (non-fatal)", e); }

      // Re-runs the crop's OCR'd text through the SAME parseOrderText() used for the whole
      // page, then hands back only the one field this call cares about — reuses every bit of
      // existing, already-tested cleaning logic (titleCandidate, extractUsernameNear, etc.)
      // instead of duplicating it for a cropped image.
      var zoomField = async function(bbox, magnify, pick){
        if (!bbox) return null;
        try {
          var cropBlob = await cropAndUpscale(imgA, bbox, magnify);
          if (!cropBlob) return null;
          var cropResult = await worker.recognize(cropBlob);
          return pick(parseOrderText(cropResult.data.text || ""));
        } catch(e){ console.warn("Zoom re-read failed (non-fatal)", e); return null; }
      };

      // Item title: ONLY when the main pass found nothing at all — NOT on low-agreement
      // between the two on-page readings. Originally also fired on low-agreement, but real
      // testing caught it making things actively worse: when candA/candB disagree, the
      // junk-ratio picker inside titleCandidate() usually already resolves it correctly (it
      // did, in the case that exposed this) — the zoom's OWN line-finding is subject to the
      // exact same kind of ambiguity, so on a page where that's already hard to get right, an
      // "extra" attempt isn't independent enough to trust over the one that already worked.
      // low-agreement STAYS a flag for a human to glance at; it no longer triggers an
      // automated overwrite attempt.
      var mainTitle = extracted && extracted.items[0] ? extracted.items[0].title : null;
      if (extracted && !mainTitle){
        scanState = { active:true, label:"Zooming in on the item title for a cleaner read…" };
        render();
        var titleBbox = findTitleLineBbox(resultA.data, /^order details\b/i) || findTitleLineBbox(resultA.data, /^items?\b/i);
        var zoomedTitle = await zoomField(titleBbox, 3, function(r){ return r.items[0] ? r.items[0].title : null; });
        // Since this only runs when there was NOTHING before, almost anything is an
        // improvement — except obviously glued-on junk (a checkbox-icon fragment, or
        // adjacent table-header text like "Quantity"/"Item price" that the crop's own
        // boundary happened to include). Guard against inserting that instead of leaving the
        // field honestly empty for a human to fill in.
        if (zoomedTitle && !looksLikeJunkTitle(zoomedTitle)){
          if (extracted.items[0]) extracted.items[0].title = zoomedTitle;
          else extracted.items = [{ title: zoomedTitle, quantity: 1, itemPrice: extracted.subtotal, itemTotal: extracted.subtotal, itemId: null }];
        }
      }

      // Buyer username: this is now the ONLY identity field captured (see where it's
      // extracted for why — usernames have needed far fewer fixes than names ever did), so
      // getting it right matters more than any other field except net profit. Unlike every
      // other zoomed field on this page, this one now runs UNCONDITIONALLY — not just when
      // the main pass came up empty or looked shaky. Reason: usernames with multiple
      // underscores have shown up TWICE now with a DIFFERENT subset of underscores misread as
      // spaces each time ("tcg_with_remmieg" -> "tog with remmieg" once, "tog_with remmieg"
      // another time on the same real order) — a text-side confidence heuristic can only ever
      // catch shapes it already knows to look for, and kept missing this one in slightly
      // different disguises. A genuinely independent second OCR read of the same region, at
      // higher magnification, doesn't have that blind spot: it either agrees (reinforcing
      // confidence for free) or disagrees (which is real signal either way — not something to
      // skip just because the first read looked clean enough not to double-check).
      {
        scanState = { active:true, label:"Zooming in on the buyer username for a cleaner read…" };
        render();
        var buyerBboxLines = flattenLines(resultA.data);
        var buyerAnchorIdx = -1;
        for (var uai=0; uai<buyerBboxLines.length; uai++){
          if (/\bBuyer\b/.test(buyerBboxLines[uai].text||"") && !/Buyer\s*(paid|selected)/i.test(buyerBboxLines[uai].text||"")){ buyerAnchorIdx = uai; break; }
        }
        if (extracted && buyerAnchorIdx >= 0){
          var userBbox = buyerBboxLines[buyerAnchorIdx].bbox;
          for (var ubi=buyerAnchorIdx+1; ubi<buyerBboxLines.length && ubi<buyerAnchorIdx+4; ubi++){
            userBbox = unionBbox(userBbox, buyerBboxLines[ubi].bbox);
          }
          var originalBuyerName = extracted.buyerName;
          var originalLowConfidence = !!extracted.buyerUsernameLowConfidence;
          var zoomedUser = await zoomField(userBbox, 5, function(r){ return { value: r.buyerName, lowConfidence: r.buyerUsernameLowConfidence }; });
          var zoomedUsername = zoomedUser ? zoomedUser.value : null;
          var zoomedLowConfidence = !!(zoomedUser && zoomedUser.lowConfidence);
          var reconciled = reconcileUsername(originalBuyerName, originalLowConfidence, zoomedUsername, zoomedLowConfidence);
          extracted.buyerName = reconciled.buyerName;
          extracted.buyerUsernameLowConfidence = reconciled.lowConfidence;
          if (reconciled.conflict) extracted.buyerUsernameZoomConflict = reconciled.conflict;
        }
      }

      // Item ID: the PRIMARY, exact-match product key (see matchProduct) — unlike the fuzzy
      // title matching it replaced, an exact match has no tolerance for being "close enough,"
      // so a single misread digit here either silently fails to match a listing that's
      // already known, or (much less likely, but not impossible) collides with a different
      // product's stored ID. Confirmed real on this exact field earlier this session (OCR
      // read "167564602795" where the page actually said "147564602795" — both well-formed,
      // no format check could ever catch it). That case is also caught by the dual full-page
      // pass comparison in diffExtractions(), but this crop-based re-read gives Tesseract
      // meaningfully more pixels per digit than either full-page pass gets, so — like the
      // order number and buyer username above — this now always cross-checks instead of only
      // reaching for a re-read when the ID is missing outright.
      var mainItemId = extracted && extracted.items[0] ? extracted.items[0].itemId : null;
      {
        var itemIdLines = flattenLines(resultA.data);
        var itemIdBbox = null;
        for (var iii=0; iii<itemIdLines.length; iii++){
          if (/Item ID:?\s*\d/i.test(itemIdLines[iii].text||"")){ itemIdBbox = itemIdLines[iii].bbox; break; }
        }
        if (extracted && extracted.items[0] && itemIdBbox){
          scanState = { active:true, label:"Zooming in on the item ID for a cleaner read…" };
          render();
          var zoomedItemId = await zoomField(itemIdBbox, 5, function(r){ return r.items[0] ? r.items[0].itemId : null; });
          if (!mainItemId){
            if (zoomedItemId) extracted.items[0].itemId = zoomedItemId;
          } else if (zoomedItemId && zoomedItemId !== mainItemId){
            // Both readings are well-formed numeric IDs but land on different digits — can't
            // tell which is right from text alone. Keep the original, flag both.
            extracted.itemIdZoomConflict = { original: mainItemId, zoomed: zoomedItemId };
          }
        }
      }

      // Net profit: the single most consequential field on the page. `earningsConflict` means
      // the directly-read value and the orderTotal-minus-fees computed value already disagree
      // and NEITHER was auto-trusted (see where earningsConflict is set — the computed side
      // isn't presumed correct anymore, since its own inputs can carry the same dropped-digit
      // error).
      //
      // A magnified re-read of the "Order earnings" line itself turned out NOT to be a reliable
      // tie-breaker: on the exact real order this whole mechanism was built around, the direct
      // read came back "$1.64" and a 5x zoom of the SAME line came back "$10.64" — a third,
      // still-wrong value that matched neither the original nor the computed figure. Magnifying
      // a crop can't recover a digit the source image never captured; it just gives OCR another
      // chance to misread the same degraded pixels differently. So this line's own zoom is used
      // only as a fast path (skip straight to computed if it happens to confirm computed) — it
      // is never treated as evidence FOR the original, and never blocks resolution when it comes
      // back matching neither side.
      //
      // The real, reliable check is verifying the COMPUTED side's own inputs instead: Transaction
      // fees and Shipping label cost are each independently OCR'd from their own clearly-labeled
      // line, so a magnified re-read of THOSE (larger, cleaner text than the tiny earnings
      // figure) can actually catch it if one of them — not "Order earnings" — was the real
      // culprit. If both fees check out clean, computed has no demonstrated defect while the
      // direct "Order earnings" read is the one field proven unreliable at both normal AND
      // magnified resolution — so computed wins outright, automatically, no flag left behind.
      if (extracted && extracted.earningsConflict){
        var conflict = extracted.earningsConflict;
        scanState = { active:true, label:"Zooming in on Order earnings for a cleaner read…" };
        render();
        var earningsLines = flattenLines(resultA.data);
        var earningsBbox = null;
        for (var eli=0; eli<earningsLines.length; eli++){
          if (/Order earnings/i.test(earningsLines[eli].text||"")){ earningsBbox = earningsLines[eli].bbox; break; }
        }
        var zoomedEarnings = earningsBbox ? await zoomField(earningsBbox, 5, function(r){ return r.orderEarningsRaw; }) : null;
        var agreesWithComputed = zoomedEarnings != null && Math.abs(zoomedEarnings - conflict.computed) <= 0.02;

        if (agreesWithComputed){
          extracted.orderEarnings = conflict.computed;
          extracted.earningsConflict = null;
        } else {
          scanState = { active:true, label:"Zooming in on selling costs for a cleaner read…" };
          render();
          var feeLines = flattenLines(resultA.data);
          function findFeeLineBbox(labelRe){
            for (var fli=0; fli<feeLines.length; fli++){ if (labelRe.test(feeLines[fli].text||"")) return feeLines[fli].bbox; }
            return null;
          }
          var txnFeeBbox = findFeeLineBbox(/Transaction fees/i);
          var shipLabelBbox = findFeeLineBbox(/Shipping label/i);
          var zoomedTxnFee = txnFeeBbox ? await zoomField(txnFeeBbox, 5, function(r){ return r.transactionFees; }) : null;
          var zoomedShipLabel = shipLabelBbox ? await zoomField(shipLabelBbox, 5, function(r){ return r.shippingLabelCost; }) : null;
          var origTxnFee = extracted.transactionFees, origShipLabel = extracted.shippingLabelCost;
          function earningsBalances(fee, shipLbl){
            return Math.abs(conflict.original - Math.round((extracted.orderTotal - extracted.salesTax - Math.abs(fee) - Math.abs(shipLbl||0) - Math.abs(extracted.otherFees||0)) * 100) / 100) <= 0.02;
          }
          if (zoomedTxnFee != null && Math.abs(zoomedTxnFee - origTxnFee) > 0.02 && earningsBalances(zoomedTxnFee, origShipLabel)){
            // Transaction fees was the actual culprit — correcting it brings computed back in
            // line with the original direct read, so the original earnings figure was right.
            extracted.transactionFees = zoomedTxnFee;
            extracted.earningsConflict = null;
          } else if (zoomedShipLabel != null && Math.abs(zoomedShipLabel - (origShipLabel||0)) > 0.02 && earningsBalances(origTxnFee, zoomedShipLabel)){
            extracted.shippingLabelCost = zoomedShipLabel;
            extracted.earningsConflict = null;
          } else {
            // Both fee inputs check out clean under magnification — computed has no
            // demonstrated defect. Trust it over the direct "Order earnings" read, which is the
            // one field this entire mechanism exists because of.
            extracted.orderEarnings = conflict.computed;
            extracted.earningsConflict = null;
          }
        }
      }

      // Payment breakdown (Subtotal/Shipping/Sales tax/Order total): fully automated
      // resolution instead of asking a human, by finding WHICH single field's own independent
      // magnified re-read actually explains the discrepancy — this is what should have caught
      // the real bug directly (Shipping misread as "$1.94" instead of "$11.94") instead of
      // just detecting that SOMETHING was off. Re-reads Subtotal, Shipping, and Sales tax each
      // from their own line (Order total is left alone — it already appears twice on the page
      // independently, so it's the least likely of the four to be the actual culprit), then
      // tries substituting each candidate's zoomed value one at a time to see which single
      // substitution makes "Order total = Subtotal + Shipping + Sales tax" balance again.
      if (extracted && extracted.subtotalConflict){
        scanState = { active:true, label:"Zooming in on the payment breakdown for a cleaner read…" };
        render();
        var payLines = flattenLines(resultA.data);
        function findMoneyLineBbox(labelRe){
          for (var pli=0; pli<payLines.length; pli++){ if (labelRe.test(payLines[pli].text||"")) return payLines[pli].bbox; }
          return null;
        }
        var subtotalBbox = findMoneyLineBbox(/Subtotal\b/i);
        var shippingBbox = findMoneyLineBbox(/Shipping\b(?!\s*label)/i);
        var salesTaxBbox = findMoneyLineBbox(/Sales tax/i);

        var zoomedSubtotal = subtotalBbox ? await zoomField(subtotalBbox, 5, function(r){ return r.subtotalRaw; }) : null;
        var zoomedShipping = shippingBbox ? await zoomField(shippingBbox, 5, function(r){ return r.shippingChargedToBuyer; }) : null;
        var zoomedSalesTax = salesTaxBbox ? await zoomField(salesTaxBbox, 5, function(r){ return r.salesTax; }) : null;

        var breakdownResult = findBreakdownCulprit(
          { subtotal: extracted.subtotalConflict.original, shipping: extracted.shippingChargedToBuyer, salesTax: extracted.salesTax },
          { subtotal: zoomedSubtotal, shipping: zoomedShipping, salesTax: zoomedSalesTax },
          extracted.orderTotal
        );
        if (breakdownResult.resolved){
          if (breakdownResult.culprit){
            var culprit = breakdownResult.culprit;
            if (culprit.field === "shipping") extracted.shippingChargedToBuyer = culprit.value;
            else if (culprit.field === "salesTax") extracted.salesTax = culprit.value;
            else if (culprit.field === "subtotal") extracted.subtotal = culprit.value;
          }
          extracted.subtotalConflict = null;
        }
        // Otherwise: genuinely irreducible ambiguity even after independently re-reading
        // every candidate field. Leave the conflict flag in place; this should now be rare.
      }
    } catch(e){
      console.warn("OCR failed", e);
      toast("Couldn't auto-read that screenshot — the image is saved, fill in details manually.");
      extracted = null;
    }

    // Second, independently-preprocessed pass purely to verify the first one. If it fails
    // for any reason, that's fine — it only ever adds cross-check flags on top of a good
    // primary read, so its failure must never wipe out extracted data that already worked.
    if (extracted){
      var extractedB = null, confidenceB = null;
      try {
        scanState = { active:true, label:"Double-checking with a second independent read…" };
        render();
        var imgB = await preprocessForOCR(file, "threshold");
        var resultB = await worker.recognize(imgB);
        extractedB = parseOrderText(resultB.data.text || "");
        confidenceB = typeof resultB.data.confidence === "number" ? resultB.data.confidence : null;
      } catch(e){
        console.warn("OCR verification pass failed (non-fatal, using first pass only)", e);
      }
      reviewFlags = validateExtraction(extracted).concat(diffExtractions(extracted, extractedB));
      // Both passes reading the image as genuinely hard to make out (not just disagreeing
      // with each other, but each individually unsure) is worth a heads-up on its own, even
      // when nothing above happened to catch a specific field going wrong. Only fires when
      // BOTH passes are low, and only ever the second, verification pass can be missing
      // (confidenceB null) without suppressing this — a single low reading from pass A alone
      // isn't corroborated by anything, so it's not raised as its own flag.
      var lowConf = confidenceA != null && confidenceA < 65 && (confidenceB == null || confidenceB < 65);
      if (lowConf){
        reviewFlags = reviewFlags.concat([{ field: "_overall", severity: "warn",
          message: "OCR read this screenshot with low confidence overall ("+Math.round(confidenceA)+"%) — worth reading every field against the actual image, not just the flagged ones." }]);
      }
    }

    scanState = { active:false, label:"" };
    render();
    openScanReviewModal(extracted, uploaded.id, reviewFlags);
  }

  // ---------- event wiring ----------
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.dataset.action;

    if (action==="backdrop" && e.target===t) return closeModal();
    if (action==="close-modal") return closeModal();
    if (action==="close-lightbox" && e.target===t) return closeLightbox();
    if (action==="zoom-image") return openLightbox(t.dataset.src);
    if (action==="copy-raw-ocr"){
      var rawTxt = t.dataset.text || "";
      var done = function(){ toast("Raw OCR text copied"); };
      var failed = function(){ toast("Couldn't copy automatically — select the text below and copy it manually."); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(rawTxt).then(done).catch(function(){
          // Some sandboxed contexts block the async Clipboard API outright — fall back to
          // the older execCommand approach via a temporary offscreen textarea.
          try {
            var ta = document.createElement("textarea");
            ta.value = rawTxt;
            ta.style.position = "fixed"; ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            var ok = document.execCommand("copy");
            document.body.removeChild(ta);
            ok ? done() : failed();
          } catch(e){ failed(); }
        });
      } else { failed(); }
      return;
    }
    if (action==="confirm-yes"){
      var cb = pendingConfirm; pendingConfirm = null;
      closeModal();
      if (cb) cb();
      return;
    }
    if (action==="goto-inventory") return setTab("inventory");
    if (action==="goto-sales") return setTab("sales");

    if (action==="open-add-product") return openAddProductModal();
    if (action==="open-add-batch") return openAddBatchModal(t.dataset.product);
    if (action==="edit-batch") return openEditBatchModal(t.dataset.id);
    if (action==="open-add-sale") return openAddSaleModal(t.dataset.product||null);
    if (action==="edit-sale") return openEditSaleModal(t.dataset.id);
    if (action==="view-order") return openOrderDetailModal(t.dataset.id);
    if (action==="open-add-settlement") return openAddSettlementModal();
    if (action==="open-file-picker") return $("#scanFileInput").click();

    if (action==="mark-received"){
      updateBatch(t.dataset.id, { status:"received", receivedDate: todayISO(), needsReview:false });
      toast("Marked received");
      return;
    }
    if (action==="delete-batch"){
      var delBatchId = t.dataset.id;
      confirmAction("Remove this batch? This can't be undone.", function(){ deleteBatch(delBatchId); });
      return;
    }
    if (action==="delete-sale"){
      var delSaleId = t.dataset.id;
      confirmAction("Remove this sale? This can't be undone.", function(){ deleteSale(delSaleId); });
      return;
    }
    if (action==="delete-settlement"){
      var delSettlementId = t.dataset.id;
      confirmAction("Remove this payment record? This can't be undone.", function(){ deleteSettlement(delSettlementId); });
      return;
    }

    if (action==="submit-add-product"){
      var name = $("#f_name").value.trim();
      if (!name){ toast("Item name is required"); return; }
      addProduct({ name: name, category: $("#f_cat").value.trim() || "Other" }).then(function(ref){
        var pid = ref && ref.id ? ref.id : ref;
        var qty = Number($("#f_qty").value)||1;
        if (qty>0){
          addBatch({
            productId: pid, owner: $("#f_owner").value, quantity: qty,
            unitCost: Number($("#f_cost").value)||0, status: $("#f_status").value,
            expectedArrival: $("#f_arrival").value || null,
            receivedDate: $("#f_status").value==="received" ? todayISO() : null,
            note: $("#f_note").value.trim(), needsReview:false
          });
        }
        toast("Item added");
      });
      closeModal();
      return;
    }

    if (action==="submit-add-batch"){
      addBatch({
        productId: $("#f_product").value, owner: $("#f_owner").value,
        quantity: Number($("#f_qty").value)||1, unitCost: Number($("#f_cost").value)||0,
        status: $("#f_status").value, expectedArrival: $("#f_arrival").value || null,
        receivedDate: $("#f_status").value==="received" ? todayISO() : null,
        note: $("#f_note").value.trim(), needsReview:false
      });
      toast("Batch added");
      closeModal();
      return;
    }

    if (action==="submit-edit-batch"){
      var id = $("#f_id").value;
      updateBatch(id, {
        owner: $("#f_owner").value, quantity: Number($("#f_qty").value)||1,
        unitCost: Number($("#f_cost").value)||0, status: $("#f_status").value,
        expectedArrival: $("#f_arrival").value || null,
        receivedDate: $("#f_status").value==="received" ? (todayISO()) : null,
        note: $("#f_note").value.trim(), needsReview:false
      });
      toast("Batch updated");
      closeModal();
      return;
    }

    if (action==="submit-add-sale"){
      var pid2 = $("#f_product").value;
      if (!pid2){ toast("Pick an item"); return; }
      var profit = $("#f_profit").value;
      if (profit===""){ toast("Enter the net profit"); return; }
      var addQty = Number($("#f_qty").value)||1;
      var addDate = $("#f_date").value || todayISO();
      var addWho = $("#f_who").value;
      addSale({
        productId: pid2, quantitySold: addQty,
        saleDate: addDate, netProfit: Number(profit)||0,
        soldPrice: $("#f_price").value ? Number($("#f_price").value) : null,
        attributedTo: addWho, note: $("#f_note").value.trim(),
        buyerName: $("#f_buyer").value.trim() || null,
        orderNumber: $("#f_ordernum").value.trim() || null,
        lifecycleStatus: $("#f_funds").value
      });
      syncStockForSale(pid2, addQty, addWho, addDate, null);
      toast("Sale recorded");
      closeModal();
      return;
    }

    if (action==="submit-edit-sale"){
      var sid = $("#f_id").value;
      var editPid = $("#f_product").value;
      var editQty = Number($("#f_qty").value)||1;
      var editDate = $("#f_date").value || todayISO();
      var editWho = $("#f_who").value;
      updateSale(sid, {
        productId: editPid, quantitySold: editQty,
        saleDate: editDate, netProfit: Number($("#f_profit").value)||0,
        soldPrice: $("#f_price").value ? Number($("#f_price").value) : null,
        attributedTo: editWho, note: $("#f_note").value.trim(),
        buyerName: $("#f_buyer").value.trim() || null,
        orderNumber: $("#f_ordernum").value.trim() || null,
        lifecycleStatus: $("#f_funds").value
      });
      syncStockForSale(editPid, editQty, editWho, editDate, sid);
      toast("Sale updated");
      closeModal();
      return;
    }

    if (action==="submit-scan-review"){
      var chosenPid = $("#f_product").value;
      var newTitle = $("#f_new_title").value.trim();
      var screenshotId = $("#f_screenshot").value;
      var matchedSaleId = $("#f_matched_sale").value;
      var profitVal = $("#f_profit").value;
      if (profitVal===""){ toast("Enter the net profit (eBay's “Order earnings”)"); return; }

      var finishSave = function(pid){
        var fundsVal = $("#f_funds").value;
        var alertsText = $("#f_note").value.trim();
        var existing = matchedSaleId ? state.sales.find(function(x){return x.id===matchedSaleId;}) : null;
        var prevShots = existing && existing.screenshots ? existing.screenshots.slice() : [];
        var newShots = prevShots.concat([{ id: screenshotId, stage: fundsVal, uploadedAt: Date.now() }]);
        var patch = {
          productId: pid, quantitySold: Number($("#f_qty").value)||1,
          saleDate: $("#f_date").value || todayISO(), netProfit: Number(profitVal)||0,
          soldPrice: $("#f_price").value ? Number($("#f_price").value) : null,
          attributedTo: $("#f_who").value,
          buyerName: $("#f_buyer").value.trim() || null,
          orderNumber: $("#f_ordernum").value.trim() || null,
          salesRecordNo: ctx.salesRecordNo || (existing ? existing.salesRecordNo : null) || null,
          lifecycleStatus: fundsVal,
          fundsStatus: fundsVal==="completed" ? "available" : "on_hold",
          alerts: alertsText ? alertsText.split(/;\s*/).filter(Boolean) : [],
          screenshots: newShots,
          note: existing ? (existing.note||"") : ""
        };
        if (existing){ updateSale(existing.id, patch); toast("Order updated"); }
        else { addSale(patch); toast("Order saved"); }
        syncStockForSale(pid, patch.quantitySold, patch.attributedTo, patch.saleDate, existing ? existing.id : null);
        closeModal();
      };

      var proceedToSave = function(){
        if (!chosenPid){
          if (!newTitle){ toast("Pick an item, or type a name for the new item"); return; }
          // Stash the item ID (if this scan found one) on the new product so a later scan of
          // the exact same eBay listing can match it by ID instead of fuzzy title text.
          addProduct({ name: newTitle, category: "Other", itemId: ctx.itemId || null }).then(function(ref){
            finishSave(ref && ref.id ? ref.id : ref);
          });
        } else {
          finishSave(chosenPid);
        }
      };

      // Re-run the same consistency/plausibility checks against the CURRENT form values
      // (not the stale scan-time extraction) right before saving — if the user already fixed
      // whatever was flagged, there's nothing left to confirm and this is invisible; if
      // something still looks off, make them look at it once more instead of letting a
      // banner they scrolled past let a bad number into the ledger.
      var ctx = {};
      try { ctx = JSON.parse($("#f_extract_ctx").value || "{}"); } catch(e){}
      var chosenItemTitle = chosenPid ? (productById(chosenPid)||{}).name : newTitle;
      var liveSnapshot = {
        buyerName: $("#f_buyer").value.trim() || null,
        orderNumber: $("#f_ordernum").value.trim() || null,
        items: [{ title: chosenItemTitle || null }],
        orderEarnings: profitVal!=="" ? Number(profitVal) : null,
        subtotal: ctx.subtotal,
        orderTotal: ctx.orderTotal,
        buyerPaidDate: $("#f_date").value || null,
        fundsStatus: $("#f_funds").value==="completed" ? "available" : "on_hold"
      };
      var liveFlags = validateExtraction(liveSnapshot);
      if (liveFlags.length){
        confirmAction(null, proceedToSave, {
          title: "Double-check before saving",
          okLabel: "Save anyway",
          danger: false,
          html: "<div>Still flagged on this order:</div><ul style='margin:8px 0 0 18px;padding:0;'>"+
            liveFlags.map(function(f){return "<li>"+esc(f.message)+"</li>";}).join("")+"</ul>"
        });
      } else {
        proceedToSave();
      }
      return;
    }

    if (action==="submit-add-settlement"){
      var from = $("#f_from").value, to = $("#f_to").value;
      if (from===to){ toast("From and To must be different people"); return; }
      var amt = $("#f_amount").value;
      if (!amt){ toast("Enter an amount"); return; }
      addSettlement({ from: from, to: to, amount: Number(amt)||0, date: $("#f_date").value||todayISO(), note: $("#f_note").value.trim() });
      toast("Payment logged");
      closeModal();
      return;
    }
  });

  document.querySelectorAll(".navbtn").forEach(function(b){ b.addEventListener("click", function(){ setTab(b.dataset.tab); }); });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && $("#modalRoot .modal")) closeModal();
  });

  $("#scanFileInput").addEventListener("change", function(){
    var f = this.files && this.files[0];
    this.value = "";
    if (f) scanScreenshot(f);
  });
  document.addEventListener("dragover", function(e){
    if (e.target.closest && e.target.closest("#dropzone")){ e.preventDefault(); e.target.closest("#dropzone").classList.add("drag"); }
  });
  document.addEventListener("dragleave", function(e){
    var dz = e.target.closest && e.target.closest("#dropzone");
    if (dz) dz.classList.remove("drag");
  });
  document.addEventListener("drop", function(e){
    var dz = e.target.closest && e.target.closest("#dropzone");
    if (!dz) return;
    e.preventDefault();
    dz.classList.remove("drag");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) scanScreenshot(f);
  });

  var whoSel = $("#whoAmI");
  OWNERS.forEach(function(o){ var opt=document.createElement("option"); opt.value=o; opt.textContent=o; whoSel.appendChild(opt); });
  whoSel.value = whoAmI;
  whoSel.addEventListener("change", function(){ whoAmI = whoSel.value; localStorage.setItem("flipLedgerWhoAmI", whoAmI); render(); });

  // ---------- boot ----------
  function seedLocalExample(){
    var pid = uid();
    state.products = [{ id: pid, name:"Example: Charizard ex Booster Box", category:"Pokémon TCG", createdAt: Date.now() }];
    state.batches = [{ id: uid(), productId: pid, owner:"Jon", quantity:2, unitCost:89.99, status:"transit", expectedArrival: todayISO(), note:"Example row — add your real items from Inventory.", needsReview:false, createdAt: Date.now() }];
    state.sales = [];
    state.settlements = [];
  }

  // Firebase config is intentionally public in client code — Firebase's real access control
  // lives in Firestore Security Rules (deployed separately in the console), not in keeping
  // this object secret. This replaces the old `window.claude.use("db"/"assets")` capabilities,
  // which only existed when this page was served as a Claude Artifact.
  var firebaseConfig = {
    apiKey: "AIzaSyCwawIqm-fnjzzrk84gdJZ1oZ9qSKw_APw",
    authDomain: "keptmintco.firebaseapp.com",
    projectId: "keptmintco",
    storageBucket: "keptmintco.firebasestorage.app",
    messagingSenderId: "1063151863897",
    appId: "1:1063151863897:web:377148710df2d7a7e04948",
    measurementId: "G-33YKFG8WRH"
  };

  // Wraps Firebase Storage in the same shape `assetsCap` used to have (`.upload(file)` ->
  // something with an `.id`) so every existing call site keeps working unchanged. The `.id`
  // here IS the real download URL (not an opaque id needing a separate resolve step), which is
  // why every old `/_blob/`+id reference was changed to just use the id directly — see the
  // <img> tags in the order list/detail/review-modal code.
  function makeStorageAdapter(storageInstance, uid){
    return {
      upload: async function(file){
        var path = "screenshots/" + uid + "/" + Date.now() + "_" + Math.random().toString(36).slice(2) + ".png";
        var ref = storageInstance.ref(path);
        await ref.put(file);
        var url = await ref.getDownloadURL();
        return { id: url };
      }
    };
  }

  async function boot(){
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      var cred = await firebase.auth().signInAnonymously();
      db = firebase.firestore();
      assetsCap = makeStorageAdapter(firebase.storage(), cred.user.uid);
      subscribeCollections();
    } catch(e){
      console.warn("Firebase init failed", e);
      db = null; assetsCap = null;
      showSyncBanner("Couldn't connect to the shared database — check your internet connection and reload. Changes won't be saved until this reconnects.");
      seedLocalExample();
    }
    render();
    if (tab==="orders") render();
  }
  boot();
})();
