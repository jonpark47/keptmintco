  // (almost always an earlier OCR scan of the same listing, which is exactly the kind of
  // digit-loss/truncation-prone read this CSV path exists to route around), the CSV wins.
  // Applies here to the product's own name, not just fields on the sale: a product matched by
  // item ID keeps that id forever, but its stored title gets corrected to the CSV's exact text
  // whenever they differ, rather than leaving whatever an earlier OCR guess produced in place.
  function upsertProductForCSV(itemId, title){
    var existing = itemId ? state.products.find(function(p){ return p.itemId === itemId; }) : null;
    if (existing){
      if (title && title !== existing.name) updateProduct(existing.id, { name: title });
      return Promise.resolve(existing.id);
    }
    return addProduct({ name: title || "Unknown item", category: "Other", itemId: itemId || null }).then(function(ref){
      return ref && ref.id ? ref.id : ref;
    });
  }
  // Upserts by order number — the exact, always-present join key in both eBay reports — instead
  // of the fuzzy title/word-overlap matching OCR needs, since a CSV's item title is always the
  // exact real listing text and its order number is always exact too. A field only overwrites
  // an existing sale's value when this import's own source actually has it (checked one at a
  // time below), so importing the Orders Report first and the Transaction report second (or
  // vice versa) always merges into one complete record instead of the second wiping the first.
  function importCSVRecords(records){
    var created = 0, updated = 0;
    var chain = Promise.resolve();
    records.forEach(function(rec){
      chain = chain.then(function(){
        // Real bug, found live: resolving the product by item ID on every import — even for an
        // order that's ALREADY linked to a sale — created a duplicate product whenever that
        // existing product's item ID happened to be missing (e.g. an original OCR scan that
        // never captured a clean "Item ID:" line, which is exactly what happened to a real GTA6
        // order here). The sale then got silently re-pointed at the new duplicate, orphaning
        // the ORIGINAL product and every batch on it — including a manually-entered unit
        // cost/expected-arrival Jon had typed in by hand, which is why it looked deleted even
        // though nothing was actually destroyed, just abandoned. Order number is a stronger,
        // already-exact signal than item ID for an order that's already in the system: if a
        // sale already exists for this order, its productId is ALREADY correct (whatever it
        // is) — reuse it directly instead of re-deriving the product at all, so linkage can
        // never drift. Only a genuinely new order (no existing sale for this order number at
        // all) goes through item-ID-based product matching/creation.
        var existingForProduct = findByOrderNumber(rec.orderNumber);
        var productStep = existingForProduct
          ? Promise.resolve(existingForProduct.productId).then(function(pid){
              // Bonus correctness fix while we're here: backfill the item ID onto whatever
              // product this order already points to, if it's missing one — so a FUTURE import
              // of a different order for the same listing can match by item ID cleanly instead
              // of hitting this same gap again.
              var prod = productById(pid);
              var productPatch = {};
              if (prod && !prod.itemId && rec.itemId) productPatch.itemId = rec.itemId;
              if (prod && rec.title && rec.title !== prod.name) productPatch.name = rec.title;
              if (Object.keys(productPatch).length) updateProduct(pid, productPatch);
              return pid;
            })
          : upsertProductForCSV(rec.itemId, rec.title);
        return productStep.then(function(pid){
          var existing = existingForProduct;
          // Tracks WHICH fields this import actually verified, per field — not a single
          // all-or-nothing flag — because the two report types cover different subsets (the
          // Orders Report alone never provides netProfit/lifecycleStatus at all). A sale touched
          // only by the Orders Report must still let a later real OCR scan fill in its net
          // profit; only fields a CSV genuinely provided should ever be protected from being
          // overwritten by a less-reliable OCR guess (see finishSave in submit-scan-review).
          // Jon's explicit call: CSV data takes priority whenever it disagrees with OCR, for
          // whichever fields it actually covers — permanently, not just at import time.
          var patch = { productId: pid, orderNumber: rec.orderNumber };
          var touchedFields = ["productId", "orderNumber"];
          if (rec.buyerName){ patch.buyerName = rec.buyerName; touchedFields.push("buyerName"); }
          if (rec.quantitySold){ patch.quantitySold = rec.quantitySold; touchedFields.push("quantitySold"); }
          if (rec.saleDate){ patch.saleDate = rec.saleDate; touchedFields.push("saleDate"); }
          if (rec.salesRecordNo){ patch.salesRecordNo = rec.salesRecordNo; touchedFields.push("salesRecordNo"); }
          if (rec.soldFor != null){ patch.soldPrice = rec.soldFor; touchedFields.push("soldPrice"); }
          if (rec.subtotal != null){ patch.soldPrice = rec.subtotal; touchedFields.push("soldPrice"); }
          if (rec.netProfit != null){ patch.netProfit = rec.netProfit; touchedFields.push("netProfit"); }
          if (rec.lifecycleStatus){ patch.lifecycleStatus = rec.lifecycleStatus; touchedFields.push("lifecycleStatus"); }
          var finalDate = patch.saleDate || (existing && existing.saleDate) || todayISO();
          // eBay's own report saying either "this shipped on <date>" (Orders Report) or "funds
          // are available, no hold" (Transaction report -> lifecycleStatus "completed") is proof
          // straight from eBay's backend that the item was already in hand — same reasoning as
          // submit-scan-review's OCR "Delivered on" / funds-completed check, just sourced from a
          // CSV instead of a screenshot.
          var csvInHand = !!rec.shippedOnDate || patch.lifecycleStatus === "completed";
          if (existing){
            var mergedFields = (existing.csvFields || []).slice();
            touchedFields.forEach(function(f){ if (mergedFields.indexOf(f) === -1) mergedFields.push(f); });
            patch.csvFields = mergedFields;
            updated++;
            return updateSale(existing.id, patch).then(function(){
              return syncStockForSale(pid, patch.quantitySold||existing.quantitySold, existing.attributedTo, finalDate, existing.id, existing.id);
            }).then(function(){
              if (csvInHand) return markSaleReceived(existing.id);
            });
          } else {
            patch.csvFields = touchedFields;
            created++;
            patch.attributedTo = suggestOwner(pid);
            patch.lifecycleStatus = patch.lifecycleStatus || "pending";
            patch.quantitySold = patch.quantitySold || 1;
            return addSale(patch).then(function(ref){
              var sid = ref && ref.id ? ref.id : ref;
              // excludeSaleId = sid (its own id), not null: addSale() already pushed this sale
              // into state.sales synchronously in the offline/local fallback path (db===null),
              // so by the time this runs, the loop inside syncStockForSale would otherwise count
              // this brand-new sale's quantity a second time — once via the explicit parameter,
              // once by finding itself in state.sales unexcluded. With real Firestore this
              // never manifests (the onSnapshot update lands later, well after this callback),
              // which is exactly why it went undetected until a Node test exercised the offline
              // path directly — but excluding its own id is correct and harmless either way, so
              // there's no reason to depend on that timing at all.
              return syncStockForSale(pid, patch.quantitySold, patch.attributedTo, finalDate, sid, sid).then(function(){
                if (csvInHand) return markSaleReceived(sid);
              });
            });
          }
        });
      });
    });
    return chain.then(function(){ return { created: created, updated: updated }; });
  }
  function importCSV(file){
    return file.text().then(function(text){
      var records = parseOrdersReportCSV(text);
      var label = "Orders Report";
      if (!records){
        records = parseTransactionReportCSV(text);
        label = "Transaction report";
      }
      if (!records){
        toast("That CSV doesn't look like an eBay Orders Report or Transaction report — check you downloaded the right file.");
        return;
      }
      if (!records.length){
        toast("No real orders found in that "+label+" — nothing to import.");
        return;
      }
      scanState = { active:true, label:"Importing "+records.length+" order"+(records.length===1?"":"s")+" from "+label+"…" };
      render();
      return importCSVRecords(records).then(function(result){
        scanState = { active:false, label:"" };
        var parts = [];
        if (result.created) parts.push(result.created+" new order"+(result.created===1?"":"s")+" added");
        if (result.updated) parts.push(result.updated+" existing order"+(result.updated===1?"":"s")+" updated");
        toast("Imported from "+label+": "+(parts.join(", ")||"nothing new")+".");
        render();
      });
    }).catch(function(e){
      scanState = { active:false, label:"" };
      console.warn("CSV import failed", e);
      toast("Couldn't read that CSV file.");
      render();
    });
  }
  function findSoftDuplicate(buyerName, productId, saleDate){
    if (!buyerName || !productId) return null;
    var target = saleDate ? new Date(saleDate+"T00:00:00").getTime() : null;
    return state.sales.find(function(s){
      if (!s.buyerName || s.buyerName.toLowerCase()!==buyerName.toLowerCase()) return false;
      if (s.productId!==productId) return false;
      if (!target || !s.saleDate) return true;
      var d = Math.abs(new Date(s.saleDate+"T00:00:00").getTime()-target);
      return d <= 3*86400000;
    }) || null;
  }

  // ---------- rendering ----------
  function setTab(t){
    var changed = t !== tab;
    tab = t;
    if (tabFromHash() !== t){ try { location.hash = t; } catch(e){} }
    render();
    if (changed) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function(){
    var t = tabFromHash();
    if (t && t !== tab){ tab = t; render(); window.scrollTo(0, 0); }
  });

  function render(){
    if (tab==="orders") tab = "sales";
    document.body.setAttribute("data-tab", tab);
    var ae = document.activeElement, keep = (ae && (ae.id==="salesSearch" || ae.id==="invSearch")) ? { id:ae.id, a:ae.selectionStart, b:ae.selectionEnd } : null;
    document.querySelectorAll(".navbtn").forEach(function(b){
      var on = b.dataset.tab===tab;
      b.classList.toggle("active", on);
      if (on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    });
    var titles = { overview:"Overview", inventory:"Inventory", preorders:"Preorders", sales:"Sales", settlements:"Settlements" };
    $("#pageTitle").innerHTML = "<h1>"+titles[tab]+"</h1>";
    renderReviewBanner();
    renderOwnerBanner();
    var main = $("#main");
    main.setAttribute("aria-busy", isLoading() ? "true" : "false");
    if (isLoading()) main.innerHTML = skeletonHtml();
    else if (tab==="overview") main.innerHTML = renderOverview();
    else if (tab==="inventory") main.innerHTML = renderInventory();
    else if (tab==="preorders") main.innerHTML = renderPreorders();
    else if (tab==="sales") main.innerHTML = renderSales();
    else if (tab==="settlements") main.innerHTML = renderSettlements();
    paintIcons();
    renderScanOverlay();
    if (keep){
      var si = $("#"+keep.id);
      if (si){ si.focus(); try { si.setSelectionRange(keep.a, keep.b); } catch(e){} }
    }
  }

  // Full-screen, so it stays visible no matter which tab is open -- reads
  // straight off scanState, same one every fetch/upload/OCR stage (and CSV
  // import, and Tesseract's own per-percent progress callback -- easily
  // dozens of calls a second while it's actually recognizing text) already
  // updates, so nothing here needs its own progress tracking.
  function renderScanOverlay(){
    var root = $("#scanOverlayRoot");
    if (!scanState.active){ root.innerHTML=""; return; }
    var label = root.querySelector(".scan-overlay-label");
    if (label){
      // Overlay is already mounted -- just swap the text. Rebuilding the
      // whole thing on every single scanState update (as this used to)
      // restarted its fade-in and repainted the blurred backdrop every
      // time, which with Tesseract calling render() dozens of times a
      // second showed up as a rapid strobe/flash instead of one steady
      // screen with the spinner and bar animating smoothly underneath.
      label.textContent = scanState.label || "Importing…";
      return;
    }
    root.innerHTML =
      "<div class='scan-overlay'><div class='scan-overlay-card'>"+
        "<span class='scan-overlay-ring'></span>"+
        "<div class='scan-overlay-copy'>"+
          "<div class='scan-overlay-label'>"+esc(scanState.label||"Importing…")+"</div>"+
          "<div class='scan-overlay-sub'>Reading your order screenshot — this takes a few seconds.</div>"+
        "</div>"+
        "<div class='scan-overlay-bar'><span></span></div>"+
      "</div></div>";
  }

  function renderReviewBanner(){
    var n = needsReviewBatches().length;
    var b = $("#reviewBanner");
    if (!n){ b.innerHTML=""; return; }
    b.innerHTML = "<div class='banner'><span class='ic' data-icon='warning'></span><span>"+n+" batch"+(n>1?"es":"")+" "+(n>1?"were":"was")+" auto-added to cover a sale and need"+(n>1?"":"s")+" a real purchase cost filled in (defaulted to $0).</span>"+
      "<button data-action='goto-inventory'>Review in Inventory</button></div>";
  }

  // ---- who bought it / who gets each sale ----
  // Purchases (batches) are the source of truth for who owns stock. Sales of an item nobody has
  // logged buying can't be attributed honestly, so the app asks: Jon, Jax, or both (and how many
  // each, including units not sold yet). The split rule below mirrors ebay_sync.py: highest
  // profit per unit goes to Jon until his units are covered, the rest to Jax; sales still in
  // flight re-rank as more orders arrive, and a paid-out or hand-set sale never moves.
  var lastPurchaseUndo = null, pendingBought = null, pendingTrip = null, lastTripUndo = null;
  var PURCHASE_NOTE = "Purchase split you entered — add the unit cost when you have it.";
  function nameKey(name){ return String(name || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function groupKeyForSale(s){
    var p = productById(s.productId);
    return nameKey((p && p.name) || s.productId);
  }
  function pidsForKey(k){ return state.products.filter(function(p){ return nameKey(p.name)===k; }).map(function(p){ return p.id; }); }
  // "net profit" is really eBay's payout (after fees and label). Real profit also subtracts what
  // the owner paid, so it only exists once a unit cost has been entered for that owner's stock.
  // The balance between Jon and Jax always uses the payout, never this.
  function unitCostFor(s){
    if (!s.attributedTo) return null;
    var pids = pidsForKey(groupKeyForSale(s)), qty = 0, tot = 0;
    state.batches.forEach(function(b){
      if (pids.indexOf(b.productId)===-1 || b.owner!==s.attributedTo || (!Number(b.unitCost) && !b.costKnown)) return;
      qty += Number(b.quantity||0); tot += Number(b.quantity||0)*Number(b.unitCost);
    });
    return qty ? tot/qty : null;
  }
  function saleProfit(s){
    var u = unitCostFor(s);
    return u==null ? null : Number(s.netProfit||0) - u*Number(s.quantitySold||1);
  }
  function ownerRealProfit(owner){
    var known = 0, missing = 0;
    state.sales.forEach(function(s){
      if (s.attributedTo!==owner) return;
      var pr = saleProfit(s);
      if (pr==null) missing++; else known += pr;
    });
    return { profit:known, missing:missing };
  }
  function realUnitsFor(pids){
    var u = { Jon:0, Jax:0 };
    state.batches.forEach(function(b){
      if (pids.indexOf(b.productId)===-1 || (b.owner!=="Jon" && b.owner!=="Jax")) return;
      if (b.note===AUTO_BATCH_NOTE && !Number(b.unitCost)) return; // a sale's own placeholder, not a purchase
      u[b.owner] += Number(b.quantity||0);
    });
    return u;
  }
  function purchaseGroups(){
    var groups = {};
    state.sales.forEach(function(s){ var k = groupKeyForSale(s); (groups[k] = groups[k] || []).push(s); });
    var out = [];
    Object.keys(groups).forEach(function(k){
      var g = groups[k], pids = [];
      g.forEach(function(s){ if (pids.indexOf(s.productId)===-1) pids.push(s.productId); });
      var u = realUnitsFor(pids);
      if (u.Jon>0 || u.Jax>0) return;                                  // purchases already recorded
      var qty = g.reduce(function(a,s){ return a + Number(s.quantitySold||1); }, 0);
      if (qty < 2) return;                                             // one unit: the plain owner prompt covers it
      if (!g.some(function(s){ return !s.attributedTo; })) return;     // everything already has an owner
      out.push({ key:k, sales:g, pids:pids, qty:qty });
    });
    return out;
  }
  function needsOwnerSales(){
    var inGroup = {};
    purchaseGroups().forEach(function(g){ g.sales.forEach(function(s){ inGroup[s.id] = true; }); });
    return state.sales.filter(function(s){ return !s.attributedTo && !inGroup[s.id]; });
  }
  function allocateSales(sales, units){
    var left = { Jon:units.Jon, Jax:units.Jax }, res = {};
    function isAuto(s){ return s.ownerSource==="auto" && s.lifecycleStatus!=="completed"; }
    sales.forEach(function(s){ if (!isAuto(s) && left[s.attributedTo]!==undefined) left[s.attributedTo] -= Number(s.quantitySold||0); });
    var perUnit = function(s){ return Number(s.netProfit||0) / Math.max(Number(s.quantitySold||1), 1); };
    sales.filter(isAuto).sort(function(a,b){ return perUnit(b)-perUnit(a); }).forEach(function(s){
      var q = Number(s.quantitySold||1), owner = null;
      if (units.Jax===0) owner = "Jon";
      else if (units.Jon===0) owner = "Jax";
      else if (left.Jon >= q) owner = "Jon";
      else if (left.Jax >= q) owner = "Jax";
      else if (left.Jon>0 || left.Jax>0) owner = left.Jon >= left.Jax ? "Jon" : "Jax"; // an order can't be split: whoever has more units left takes it
      if (owner) left[owner] -= q;
      res[s.id] = owner;
    });
    return res;
  }
  function applyPurchase(key, counts, unitCost){
    var g = purchaseGroups().filter(function(x){ return x.key===key; })[0];
    if (!g) return;
    counts = { Jon: Math.max(0, Math.floor(Number(counts.Jon)||0)), Jax: Math.max(0, Math.floor(Number(counts.Jax)||0)) };
    if (!counts.Jon && !counts.Jax){ toast("Enter how many each of you bought"); return; }
    var costKnown = String(unitCost==null ? "" : unitCost).trim() !== "" && Number(unitCost) >= 0;
    var cost = costKnown ? round2(Number(unitCost)) : 0;
    var undo = { created:[], removed:[], sales:[] };
    // the $0 "covers a sale" placeholders are replaced by the real purchase below
    state.batches.filter(function(b){ return g.pids.indexOf(b.productId)!==-1 && b.note===AUTO_BATCH_NOTE && !Number(b.unitCost); })
      .forEach(function(b){ undo.removed.push(Object.assign({}, b)); deleteBatch(b.id); });
    var alloc = allocateSales(g.sales, counts);
    var ownerOf = {};
    g.sales.forEach(function(s){ ownerOf[s.id] = (s.id in alloc) ? alloc[s.id] : s.attributedTo; });
    g.sales.forEach(function(s){
      if (!(s.id in alloc)) return;
      undo.sales.push({ id:s.id, attributedTo:s.attributedTo||null, needsOwner:!!s.needsOwner, ownerSource:s.ownerSource||null });
      updateSale(s.id, { attributedTo: alloc[s.id], needsOwner: alloc[s.id]===null, ownerSource:"auto" });
    });
    // batches per owner per listing, sized to the sales that owner ends up with; anything bought
    // beyond what has sold so far sits on hand under the listing with the most sales
    var primary = g.pids.slice().sort(function(a,b){
      var n = function(pid){ return g.sales.filter(function(s){ return s.productId===pid; }).length; };
      return n(b)-n(a);
    })[0];
    ["Jon","Jax"].forEach(function(o){
      var used = 0;
      g.pids.forEach(function(pid){
        var mine = g.sales.filter(function(s){ return s.productId===pid && ownerOf[s.id]===o; });
        var q = mine.reduce(function(a,s){ return a + Number(s.quantitySold||1); }, 0);
        if (!q) return;
        used += q;
        var allShipped = mine.every(function(s){ return s.ebayShipped || s.lifecycleStatus==="completed"; });
        Promise.resolve(addBatch({ productId:pid, owner:o, quantity:q, unitCost:cost, costKnown:costKnown, status: allShipped?"received":"preorder",
                   receivedDate: allShipped?todayISO():null, expectedArrival:null, needsReview:!costKnown, note:costKnown ? "" : PURCHASE_NOTE }))
          .then(function(ref){ undo.created.push(ref && ref.id ? ref.id : ref); });
      });
      var extra = counts[o] - used;
      if (extra > 0) Promise.resolve(addBatch({ productId:primary, owner:o, quantity:extra, unitCost:cost, costKnown:costKnown, status:"received",
                                receivedDate:todayISO(), expectedArrival:null, needsReview:!costKnown, note:costKnown ? "" : PURCHASE_NOTE }))
        .then(function(ref){ undo.created.push(ref && ref.id ? ref.id : ref); });
    });
    lastPurchaseUndo = undo;
    toastAction(costKnown ? "Saved — sales split and unit cost set to "+money(cost)+"." : "Saved — sales split by who bought what.", "Undo", "undo-purchase");
  }
  function undoPurchase(){
    var u = lastPurchaseUndo;
    if (!u){ toast("Nothing to undo"); return; }
    lastPurchaseUndo = null;
    u.created.forEach(function(id){ if (id) deleteBatch(id); });
    u.removed.forEach(function(b){ var d = Object.assign({}, b); delete d.id; addBatch(d); });
    u.sales.forEach(function(x){ updateSale(x.id, { attributedTo:x.attributedTo, needsOwner:x.needsOwner, ownerSource:x.ownerSource }); });
    toast("Undone — back to how it was");
  }
  // Nothing is written until this screen is confirmed: it shows the exact units per person and
  // where every sale would land, so a wrong tap is caught here instead of afterwards.
  function openPurchaseConfirm(key, counts){
    var g = purchaseGroups().filter(function(x){ return x.key===key; })[0];
    if (!g) return;
    counts = { Jon: Math.max(0, Math.floor(Number(counts.Jon)||0)), Jax: Math.max(0, Math.floor(Number(counts.Jax)||0)) };
    if (!counts.Jon && !counts.Jax){ toast("Enter how many each of you bought"); return; }
    pendingBought = { key:key, counts:counts, cost:(pendingBought && pendingBought.key===key && pendingBought.cost) || "" };
    var alloc = allocateSales(g.sales, counts), units = { Jon:0, Jax:0 };
    var rows = g.sales.slice().sort(function(a,b){ return Number(b.netProfit||0)-Number(a.netProfit||0); }).map(function(s){
      var o = (s.id in alloc) ? alloc[s.id] : s.attributedTo, q = Number(s.quantitySold||1);
      if (o) units[o] += q;
      return "<div class='confirm-row'><span>"+money(s.netProfit)+" · "+esc(s.buyerName||"buyer")+(q>1?" · ×"+q:"")+"</span>"+(o ? ownerPill(o) : "<span class='badge owner-none'>Unassigned</span>")+"</div>";
    }).join("");
    var covered = units.Jon + units.Jax;
    var notes = "";
    var extraJon = Math.max(0, counts.Jon - units.Jon), extraJax = Math.max(0, counts.Jax - units.Jax);
    if (extraJon || extraJax) notes += "<div class='hint'>Bought but not sold yet, kept on hand: "+[extraJon?"Jon "+extraJon:"", extraJax?"Jax "+extraJax:""].filter(Boolean).join(", ")+".</div>";
    if (covered < g.qty) notes += "<div class='hint warn'>Only "+covered+" of the "+g.qty+" units sold are covered by these counts — the rest stay unassigned.</div>";
    var p = productById(g.sales[0].productId);
    openModal("Confirm who bought this",
      "<div class='sale-sub'>"+esc(p?p.name:"This item")+" — "+g.qty+" sold so far</div>"+
      "<div class='confirm-counts'><div class='cc jon'><b>"+counts.Jon+"</b><span>Jon bought</span></div><div class='cc jax'><b>"+counts.Jax+"</b><span>Jax bought</span></div></div>"+
      "<div class='sale-sub' style='margin:2px 0 6px'>Each sale would go to:</div><div class='confirm-list'>"+rows+"</div>"+notes+
      "<div class='field' style='margin-top:14px'><label for='p_cost'>Unit cost each ($) <span class='opt'>optional</span></label>"+
      "<input id='p_cost' type='number' min='0' step='0.01' inputmode='decimal' placeholder='0.00' value='"+esc(pendingBought.cost)+"'>"+
      "<div class='hint'>What you paid per unit, tax included. Type 0 if it was free. Leave it blank to add it later; profit fills in once it's set.</div></div>",
      "<button class='btn' data-action='bought-split' data-key='"+esc(key)+"'>Back</button>"+
      "<button class='btn primary' data-action='confirm-purchase' data-key='"+esc(key)+"' data-jon='"+counts.Jon+"' data-jax='"+counts.Jax+"'>Confirm</button>");
  }
  function openBoughtModal(key){
    var g = purchaseGroups().filter(function(x){ return x.key===key; })[0];
    if (!g) return;
    var p = productById(g.sales[0].productId);
    openModal("Who bought this?",

  function assignOwner(saleId, who, undo){
    var s = state.sales.find(function(x){ return x.id===saleId; });
    if (!s) return Promise.resolve();
    return Promise.resolve(updateSale(saleId, { attributedTo: who, needsOwner: false, ownerSource: "manual" })).then(function(){
      // Stock is deliberately not touched until now -- the batch that covers this sale needs an
      // owner, so it's created here (same syncStockForSale every other sale uses), and a sale eBay
      // already shows as shipped flips its stock to received the same way "Completed" does.
      return syncStockForSale(s.productId, s.quantitySold, who, s.saleDate, saleId, saleId);
    }).then(function(ref){
      if (undo && ref) undo.created.push(ref && ref.id ? ref.id : ref);
    }).then(function(){ if (s.ebayShipped) return markSaleReceived(saleId); });
  }

  function applyOwner(ids, who, flip){
    var undo = { sales:[], created:[], batches:[] };
    ids.forEach(function(id){
      var sa = state.sales.find(function(x){ return x.id===id; }); if (!sa) return;
      undo.sales.push({ id:id, attributedTo:sa.attributedTo||null, needsOwner:!!sa.needsOwner, ownerSource:sa.ownerSource||null });
      if (flip){
        batchesForSale(id).forEach(function(b){ undo.batches.push({ id:b.id, owner:b.owner }); updateBatch(b.id, { owner: who }); });
        updateSale(id, { attributedTo: who, ownerSource: "manual" });
      } else {
        assignOwner(id, who, undo);
      }
    });
    lastOwnerUndo = undo;
    toastAction(ids.length>1 ? ids.length+" sales now go to "+who+"." : "Now goes to "+who+".", "Undo", "undo-owner");
  }
  function undoOwner(){
    var u = lastOwnerUndo;
    if (!u){ toast("Nothing to undo"); return; }
    lastOwnerUndo = null;
    u.created.forEach(function(id){ if (id) deleteBatch(id); });
    u.batches.forEach(function(b){ updateBatch(b.id, { owner: b.owner }); });
    u.sales.forEach(function(x){ updateSale(x.id, { attributedTo:x.attributedTo, needsOwner:x.needsOwner, ownerSource:x.ownerSource }); });
    toast("Undone — back to how it was");
  }

  function payoutChartHtml(){
    var now = new Date(), day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var monday = new Date(day0); monday.setDate(day0.getDate() - ((day0.getDay()+6)%7));
    var weeks = [];
    for (var i=7;i>=0;i--){ var d = new Date(monday); d.setDate(monday.getDate() - 7*i); weeks.push({ start:d, sum:0 }); }
    state.sales.forEach(function(sa){
      if (!sa.saleDate) return;
      var p = sa.saleDate.split("-"); if (p.length!==3) return;
      var sd = new Date(+p[0], +p[1]-1, +p[2]);
      for (var k=weeks.length-1;k>=0;k--){
        if (sd >= weeks[k].start){ weeks[k].sum += Number(sa.netProfit||0); break; }
      }
    });
    var max = 0, total = 0;
    weeks.forEach(function(w){ if (w.sum > max) max = w.sum; total += w.sum; });
    if (!(max > 0)) return "";
    function short(v){ return v >= 1000 ? "$"+(v/1000).toFixed(1).replace(/\.0$/,"")+"k" : "$"+Math.round(v); }
    var bars = "", labels = "";
    weeks.forEach(function(w, idx){
      var h = w.sum > 0 ? Math.max(6, Math.round(w.sum/max*104)) : 3;
      var lab = w.start.toLocaleDateString("en-US",{month:"short",day:"numeric"});
      bars += "<div class='wk"+(w.sum>0?"":" zero")+(idx===weeks.length-1?" now":"")+"' title='Week of "+lab+": "+money(w.sum)+"'>"+
        "<span class='v'>"+(w.sum>0?short(w.sum):"")+"</span><div class='bar' style='height:"+h+"px'></div></div>";
      labels += "<span>"+(idx===weeks.length-1?"This wk":lab.replace(" ", "\u00a0"))+"</span>";
    });
    return "<div class='section-head'><h2>Payout by week</h2><span class='count'>last 8 weeks · "+money(total)+"</span></div>"+
      "<div class='card chart-card' role='img' aria-label='Bar chart of weekly payout for the last 8 weeks'><div class='wk-chart'>"+bars+"</div><div class='wk-labels'>"+labels+"</div></div>";
  }

  function byArrival(a,b){

  function whenPill(dateStr){

  function productGroupList(){
    var pg = {};
    state.products.forEach(function(p){ var k = nameKey(p.name); (pg[k] = pg[k] || []).push(p); });
    return Object.keys(pg).map(function(k){
      var ps = pg[k].slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
      var img = ps.filter(function(x){ return x.imageUrl; })[0];
      return { key:k, ps:ps, p: Object.assign({}, ps[0], { imageUrl: img ? img.imageUrl : ps[0].imageUrl }), pids: ps.map(function(x){ return x.id; }) };
    }).sort(function(a,b){ return (b.ps[0].createdAt||0)-(a.ps[0].createdAt||0); });
  }
  function groupStock(pids){
    var st = { received:0, pipeline:0, sold:0, remaining:0 };
    pids.forEach(function(id){ var x = stockFor(id); st.received += x.received; st.pipeline += x.pipeline; st.sold += x.sold; st.remaining += x.remaining; });
    return st;
  }
  function round2(v){ return Math.round(v*100)/100; }

  function readTrip(){
    var t = { who: ($("#t_who")||{}).value || whoAmI, total: ($("#t_total")||{}).value || "", other: ($("#t_other")||{}).value || "", otherQty: ($("#t_otherqty")||{}).value || "1", mode: "prop", items:{} };
    var m = document.querySelector("input[name='t_mode']:checked"); if (m) t.mode = m.value;
    document.querySelectorAll(".trip-row").forEach(function(row){
      var key = row.dataset.key;
      t.items[key] = { checked: row.querySelector(".trip-chk").checked, qty: row.querySelector(".trip-qty").value, price: row.querySelector(".trip-price").value };
    });
    return t;
  }
  function tripCalc(t){
    var sel = [];
    productGroupList().forEach(function(g){
      var it = t.items[g.key]; if (!it || !it.checked) return;
      sel.push({ g:g, qty: Math.max(1, Math.floor(Number(it.qty)||1)), price: Number(it.price)||0, blank: String(it.price==null?"":it.price).trim()==="" });
    });
    var subtotal = 0, units = 0;
    sel.forEach(function(r){ subtotal += r.qty*r.price; units += r.qty; });
    subtotal = round2(subtotal);
    // things bought on the same receipt that aren't in the list (an item that hasn't sold yet):
    // their price is not tax, and they take their own share of the tax
    var other = Math.max(0, Number(t.other)||0);
    var otherUnits = other > 0 ? Math.max(1, Math.floor(Number(t.otherQty)||1)) : 0;
    var base = round2(subtotal + other);
    var total = Number(t.total)||0, extras = round2(total - base);
    sel.forEach(function(r){
      var each = (t.mode==="even" || base<=0) ? ((units+otherUnits) ? extras/(units+otherUnits) : 0) : r.price*(extras/base);
      r.extraEach = each; r.final = round2(r.price + each);
    });
    var problem = "";
    if (!sel.length) problem = "Tick the items you bought on this trip.";
    else if (sel.some(function(r){ return r.blank; })) problem = "Some items have no price yet. Enter it, tap \u201cIt was $0\u201d, or skip the item.";
    else if (String(t.total).trim()==="") problem = "Enter the total you paid at checkout.";
    return { rows:sel, subtotal:subtotal, units:units, other:other, otherUnits:otherUnits, base:base, total:total, extras:extras, rate: base>0 ? extras/base : 0, problem:problem };
  }
  function updateTripSummary(){
    var box = $("#tripSummary"); if (!box) return;
    var c = tripCalc(readTrip());
    if (c.problem){ box.innerHTML = "<span class='muted'>"+esc(c.problem)+"</span>"; return; }
    box.innerHTML = "Items "+money(c.subtotal)+(c.other>0 ? " · not listed "+money(c.other) : "")+" · "+(c.extras<0?"discount ":"tax & fees ")+money(Math.abs(c.extras))+" ("+(c.rate*100).toFixed(1)+"%) · you paid <b>"+money(c.total)+"</b>";
  }

    openModal("Log a store trip",

  function flagTripMissing(keys){
    document.querySelectorAll(".trip-row").forEach(function(row){
      var miss = keys.indexOf(row.dataset.key) !== -1, w = row.querySelector(".trip-warn");
      row.classList.toggle("missing", miss);
      if (miss && !w){
        row.insertAdjacentHTML("beforeend", "<div class='trip-warn'><span><i class='warn-dot'>!</i>Price missing</span>"+
          "<button type='button' class='btn small' data-action='trip-zero'>It was $0</button>"+
          "<button type='button' class='btn small ghost' data-action='trip-skip'>Skip item</button></div>");
      } else if (!miss && w){ w.remove(); }
    });
    paintBlankBar();
  }
  function clearTripFlag(row){
    if (!row) return;
    row.classList.remove("missing");
    var w = row.querySelector(".trip-warn"); if (w) w.remove();
    paintBlankBar();
  }
  // "N without a price" bar above the list, with one-tap bulk answers
  function paintBlankBar(){
    var n = document.querySelectorAll(".trip-row.missing").length, bar = $("#tripBlankBar");
    if (!n){ if (bar) bar.remove(); return; }
    var html = "<span><i class='warn-dot'>!</i>"+n+" without a price</span>"+
      "<button type='button' class='btn small' data-action='trip-zero-all'>All $0</button>"+
      "<button type='button' class='btn small ghost' data-action='trip-skip-all'>Skip all</button>";
    if (bar){ bar.innerHTML = html; return; }
    var list = $("#modalRoot .trip-list");
    if (list) list.insertAdjacentHTML("beforebegin", "<div id='tripBlankBar' class='trip-blankbar'>"+html+"</div>");
  }
  function openTripConfirm(){
    var t = readTrip(); pendingTrip = t;
    var blanks = [];
    productGroupList().forEach(function(g){
      var it = t.items[g.key];
      if (it && it.checked && String(it.price==null?"":it.price).trim()==="") blanks.push(g.key);
    });
    if (blanks.length){
      flagTripMissing(blanks);
      var firstMiss = document.querySelector(".trip-row.missing");
      if (firstMiss && firstMiss.scrollIntoView) firstMiss.scrollIntoView({ block:"center", behavior:"smooth" });
      toast((blanks.length===1 ? "1 item still needs a price" : blanks.length+" items still need a price")+". Enter it, tap \u201cIt was $0\u201d, or skip.");
      return;
    }
    var c = tripCalc(t);
    if (c.problem){ toast(c.problem); return; }
    var paidSum = round2(c.rows.reduce(function(a,r){ return a + r.final*r.qty; }, 0));
    var rows = c.rows.map(function(r){
      return "<div class='confirm-row trip-out'><span>"+esc(r.g.p.name)+"<small>"+r.qty+" × "+money(r.price)+" + "+money(r.extraEach)+" tax &amp; fees</small></span><b>"+money(r.final)+"<small>each</small></b></div>";
    }).join("");
    openModal("Confirm unit costs",
      "<div class='sale-sub'>"+ownerPill(t.who)+" paid "+money(c.total)+" · "+c.units+" unit"+(c.units===1?"":"s")+
        (c.other>0 ? " + "+money(c.other)+" of other items not listed" : "")+"</div>"+
      "<div class='confirm-list' style='margin-top:10px'>"+rows+"</div>"+
      "<div class='hint'>These become the unit cost on "+esc(t.who)+"'s batches of each item"+(Math.abs(paidSum-c.total)>=0.01 ? " (rounded to the cent, "+money(paidSum)+" in total)" : "")+
      ". An item with no batch for "+esc(t.who)+" gets one created. You can undo right after.</div>",
      "<button class='btn' data-action='trip-back'>Back</button><button class='btn primary' data-action='trip-apply'>Apply costs</button>");
  }
  function applyTrip(){
    var t = pendingTrip; if (!t) return;
    var c = tripCalc(t); if (c.problem) return;
    var undo = { changed:[], created:[] }, today = todayISO();
    c.rows.forEach(function(r){
      var mine = state.batches.filter(function(b){ return r.g.pids.indexOf(b.productId)!==-1 && b.owner===t.who; });
      if (mine.length){
        mine.forEach(function(b){
          undo.changed.push({ id:b.id, unitCost:b.unitCost||0, costKnown:!!b.costKnown, note:b.note||"", needsReview:!!b.needsReview });
          updateBatch(b.id, { unitCost:r.final, costKnown:true, needsReview:false, note:(b.note===AUTO_BATCH_NOTE || b.note===PURCHASE_NOTE) ? "" : (b.note||"") });
        });
      } else {
        var shipped = state.sales.some(function(x){ return r.g.pids.indexOf(x.productId)!==-1 && x.ebayShipped; });
        Promise.resolve(addBatch({ productId:r.g.ps[0].id, owner:t.who, quantity:r.qty, unitCost:r.final, costKnown:true, status: shipped?"received":"preorder",
          receivedDate: shipped?today:null, expectedArrival:null, needsReview:false, note:"Store trip "+fmtDate(today) }))
          .then(function(ref){ undo.created.push(ref && ref.id ? ref.id : ref); });
      }
    });
    lastTripUndo = undo; pendingTrip = null;
    toastAction("Unit costs applied to "+c.rows.length+" item"+(c.rows.length===1?"":"s")+".", "Undo", "undo-trip");
  }
  function undoTrip(){
    var u = lastTripUndo;
    if (!u){ toast("Nothing to undo"); return; }
    lastTripUndo = null;
    u.created.forEach(function(id){ if (id) deleteBatch(id); });
    u.changed.forEach(function(x){ updateBatch(x.id, { unitCost:x.unitCost, costKnown:x.costKnown, note:x.note, needsReview:x.needsReview }); });
    toast("Undone — costs restored");
  }

  function renderInventory(){

        ((split.Jon||split.Jax) ? "<div class='split-line'><span>Bought by</span>"+ownerPill("Jon")+"<b>"+split.Jon+"</b>"+ownerPill("Jax")+"<b>"+split.Jax+"</b></div>" : "");
      if (short){

  function productChip(name){
    name = String(name || "?");
    var words = name.replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
    var ini = ((words[0] || "?").charAt(0) + (words[1] || "").charAt(0)).toUpperCase();
    var h = 0;
    for (var i = 0; i < name.length; i++){ h = (h * 31 + name.charCodeAt(i)) % 360; }
    return "<span class='chip' style='background:linear-gradient(135deg,hsl("+h+",82%,56%),hsl("+((h+48)%360)+",84%,46%))'>"+esc(ini)+"</span>";
  }
  // eBay's image host serves the same photo at several sizes by the number in the filename.
  function thumbUrl(u){ return String(u||"").replace(/\/s-l\d+\./, "/s-l300."); }
  // The listing photo when we have one; the coloured initials chip sits underneath, so a
  // missing or ended listing (image fails to load and removes itself) still looks intentional.
  function prodThumb(p, name, cls){
    var img = (p && p.imageUrl)
      ? "<img src='"+esc(thumbUrl(p.imageUrl))+"' alt='' loading='lazy' referrerpolicy='no-referrer' onerror='this.remove()'>" : "";
    return "<span class='thumb"+(cls?" "+cls:"")+"'>"+productChip(name || (p && p.name))+img+"</span>";
  }
  function bySaleNewest(a,b){
    var da = a.saleDate || "", db_ = b.saleDate || "";
    return da < db_ ? 1 : da > db_ ? -1 : (b.createdAt||0)-(a.createdAt||0);
  }

  // One row per sale: what used to be split across "Orders" (stock status, Mark received) and
  // "Sales" (the table) is the same record, so it lives in one place.
  function saleRow(s){
    var p = productById(s.productId);
    var name = p ? p.name : "Unknown item";
    var hasShot = s.screenshots && s.screenshots.length;
    var linked = batchesForSale(s.id);
    var notRecv = linked.filter(function(b){ return b.status!=="received"; });
    var stockTag = "", recvBtn = "";
    if (notRecv.length){
      stockTag = "<span class='badge status-preorder'>Not received yet</span>";
      recvBtn = "<button class='btn small ghost' data-action='mark-sale-received' data-id='"+s.id+"'>Mark received</button>";
    } else if (linked.length){
      stockTag = "<span class='badge status-received'>In hand</span>";
    }
    var payTag = s.lifecycleStatus ? "<span class='badge lifecycle-"+s.lifecycleStatus+"'>"+(s.lifecycleStatus==="pending"?"Pending payout":"Paid out")+"</span>" : "";
    var autoTag = (s.ownerSource==="auto" && s.attributedTo && s.lifecycleStatus!=="completed") ? "<span class='badge label-note' title='Split automatically by who bought what. It can shift as more orders arrive until this one is paid out — tap the owner to lock it.'>Auto-split</span>" : "";
    var labelTag = (s.profitSource==="ebay-provisional" && s.ebayShipped && s.lifecycleStatus!=="completed") ? "<span class='badge label-note' title='eBay hasn&#39;t reported the shipping label cost yet, so this is before it'>Before label cost</span>" : "";
    return "<div class='sale-row'>"+prodThumb(p, name)+
      "<div class='sale-main'>"+
        "<div class='sale-title'>"+esc(name)+"</div>"+
        "<div class='sale-sub'>"+esc(s.buyerName||"Unknown buyer")+" · "+fmtDate(s.saleDate)+(s.orderNumber?" · #"+esc(s.orderNumber):"")+(Number(s.quantitySold)>1?" · qty "+s.quantitySold:"")+"</div>"+
        "<div class='sale-tags'>"+ownerBadge(s)+autoTag+stockTag+payTag+labelTag+"</div>"+
      "</div>"+
      "<div class='sale-money'><div class='sale-profit'>"+money(s.netProfit)+"</div><div class='sale-sub'>payout</div>"+
        (function(){ var pr = saleProfit(s); return pr==null ? "<div class='sale-sub cost-missing'>profit: add cost</div>" : "<div class='sale-sub cost-known'>profit "+money(pr)+"</div>"; })()+"</div>"+
      "<div class='sale-actions'>"+recvBtn+
        (hasShot ? "<button class='btn small ghost' data-action='view-order' data-id='"+s.id+"'>View</button>" : "")+
        "<button class='btn small ghost' data-action='edit-sale' data-id='"+s.id+"'>Edit</button>"+
        "<button class='btn small ghost danger' data-action='delete-sale' data-id='"+s.id+"'>Remove</button>"+
      "</div></div>";

  function renderSales(){
    var rows = state.sales.slice().sort(bySaleNewest);
    var total = totalNetProfit(), pending = pendingProfit();

      "<div class='tile t-profit'><div class='eyebrow'>Total payout</div><div class='value'>"+money(total)+"</div><div class='sub'>"+state.sales.length+" sale"+(state.sales.length===1?"":"s")+"</div></div>"+

          "<span class='btn go'>Choose file</span></div>";

    var counts = { all:rows.length, pending:0, paid:0, unassigned:0, Jon:0, Jax:0 };
    rows.forEach(function(sa){
      if (sa.lifecycleStatus==="pending") counts.pending++;
      if (sa.lifecycleStatus==="completed") counts.paid++;
      if (!sa.attributedTo) counts.unassigned++; else counts[sa.attributedTo]++;
    });

      "<div class='fchips'>"+chipDefs.map(function(c){
        return "<button type='button' class='fchip"+(salesFilter===c[0]?" on":"")+"' data-action='sales-filter' data-f='"+c[0]+"'>"+c[1]+"<b>"+(counts[c[0]]||0)+"</b></button>";
      }).join("")+"</div></div>";
    var shown = rows.filter(function(sa){
      if (salesFilter==="pending" && sa.lifecycleStatus!=="pending") return false;
      if (salesFilter==="paid" && sa.lifecycleStatus!=="completed") return false;
      if (salesFilter==="unassigned" && sa.attributedTo) return false;
      if ((salesFilter==="Jon" || salesFilter==="Jax") && sa.attributedTo!==salesFilter) return false;
      if (!salesQ.trim()) return true;
      var pr = productById(sa.productId);
      return matchesQuery([sa.buyerName, pr && pr.name, sa.orderNumber, sa.attributedTo].join(" "), salesQ);
    });
    if (!shown.length) return html + "<div class='card empty'><div class='ic' data-icon='search'></div>No sales match that. Clear the search or pick another filter.</div>";
    return html + "<div class='sales-list'>"+shown.slice(0, salesShown).map(saleRow).join("")+"</div>"+
      (shown.length > salesShown ? "<div class='more-wrap'><button class='btn' data-action='sales-more'>Show "+Math.min(30, shown.length-salesShown)+" more · "+(shown.length-salesShown)+" left</button></div>" : "");
  }
  function matchesQuery(text, q){
    var words = String(q||"").toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    var t = String(text||"").toLowerCase();
    return words.every(function(w){ return t.indexOf(w)!==-1; });
  }

  function renderSettlements(){
    var rows = state.settlements.slice().sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
    var bal = computeBalance();
    var bl = balanceLine(bal, whoAmI);
    var pending = pendingBalance();
    // Only Jon-attributed sales ever create a debt Jax owes Jon (Jax's own eBay account already
    // holds every dollar directly, so a sale Jax attributes to himself never owes anyone
    // anything, pending or not) — this count is deliberately narrower than "all pending sales"
    // for the same reason computeBalance() only ever sums Jon's side. Spelled out explicitly so
    // it doesn't read as a bug when the total sale count and this count don't match. Named both
    // people explicitly rather than using "he"/"you" — this tile renders identically for
    // whoever's viewing, and a pronoun picked from Jon's perspective ("...since HE already
    // keeps...") reads as a factual error when Jax is the one looking at his own page.
    var pendingSub = pending.count
      ? pending.count+" sale"+(pending.count===1?"":"s")+" attributed to Jon, still shipping / awaiting eBay payout — sales attributed to Jax aren't counted here, since Jax already keeps that money directly"
      : "Nothing attributed to Jon is still waiting on eBay to pay out.";

    // Jon's call: his own net profit is what he actually wants to see first when he opens this
    // tab day to day — the cross-partner debt tiles matter less often (only when it's actually
    // time to settle up), so they now sit below instead of leading. Whoever's currently viewing
    // gets their own total/available/pending breakdown here, independent of whether it affects
    // the shared balance (a sale Jax attributes to himself never owes anyone anything, but he
    // still wants to track it — see ownerProfitBreakdown()).
    var mine = ownerProfitBreakdown(whoAmI);
    var mineSub = mine.pendingCount
      ? money(mine.available)+" available · "+money(mine.pending)+" pending across "+mine.pendingCount+" sale"+(mine.pendingCount===1?"":"s")
      : money(mine.available)+" available · nothing pending right now";
    var rp = ownerRealProfit(whoAmI);
    var html = "<div class='tiles'><div class='tile t-profit'><div class='eyebrow'>Your payout</div><div class='value'>"+money(mine.total)+"</div><div class='sub'>"+esc(mineSub)+"</div></div>"+

        (rp.missing ? "Add the unit cost on "+rp.missing+" sale"+(rp.missing===1?"":"s")+" (Inventory, Edit batch) and this fills in." : "Payout minus what you paid.")+"</div></div></div>";

    html += "<div class='section-head'><h2>Between you and Jax</h2></div>";
    html += "<div class='tiles'>"+
      "<div class='tile tone-"+bl.tone+"'><div class='eyebrow'>Available to settle now</div><div class='value'>"+esc(bl.text)+"</div><div class='sub'>From sales eBay has already paid out — the money's actually landed.</div></div>"+
