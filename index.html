  function productChip(name){
    name = String(name || "?");
    var words = name.replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
    var ini = ((words[0] || "?").charAt(0) + (words[1] || "").charAt(0)).toUpperCase();
    var h = 0;
    for (var i = 0; i < name.length; i++){ h = (h * 31 + name.charCodeAt(i)) % 360; }
    return "<span class='chip' style='background:linear-gradient(135deg,hsl("+h+",82%,56%),hsl("+((h+48)%360)+",84%,46%))'>"+esc(ini)+"</span>";
  }
  // eBay's image host serves the same photo at several sizes by the number in the filename.
  function thumbUrl(u){ return String(u||"").replace(/\/s-l\d+\./, "/s-l300."); }
  // The listing photo when we have one; the coloured initials chip sits underneath, so a
  // missing or ended listing (image fails to load and removes itself) still looks intentional.
  function prodThumb(p, name, cls){
    var img = (p && p.imageUrl)
      ? "<img src='"+esc(thumbUrl(p.imageUrl))+"' alt='' loading='lazy' referrerpolicy='no-referrer' onerror='this.remove()'>" : "";
    return "<span class='thumb"+(cls?" "+cls:"")+"'>"+productChip(name || (p && p.name))+img+"</span>";
  }
  function bySaleNewest(a,b){
    var da = a.saleDate || "", db_ = b.saleDate || "";
    return da < db_ ? 1 : da > db_ ? -1 : (b.createdAt||0)-(a.createdAt||0);
  }

  // One row per sale: what used to be split across "Orders" (stock status, Mark received) and
  // "Sales" (the table) is the same record, so it lives in one place.
  function cancelledRow(s){
    var p = productById(s.productId), name = p ? p.name : "Unknown item";
    var net = s.cancelNet, netPill = "";
    if (net!=null){
      netPill = Math.abs(net) < 0.005
        ? "<span class='badge ok-pill' title='eBay refunded the buyer in full and gave back every fee'>Refunded in full, no fees kept</span>"
        : "<span class='badge cancel-red' title='what eBay recorded for this order added up to this'>"+(net<0 ? "Lost " : "Kept ")+money(Math.abs(net))+"</span>";
    }
    return "<div class='sale-row cancelled'>"+prodThumb(p, name)+
      "<div class='sale-main'><div class='sale-title'>"+esc(name)+"</div>"+
        "<div class='sale-sub'>"+esc(s.buyerName||"Unknown buyer")+" · "+fmtDate(s.saleDate)+"</div>"+
        "<div class='sale-tags'><span class='badge cancel-red'>Cancelled</span>"+netPill+"<span class='badge qty'>Not in any totals</span></div></div>"+
      "<div class='sale-money'><div class='sale-profit'>"+money(s.netProfit)+"</div><div class='sale-sub'>was the payout</div></div>"+
      "<div class='sale-actions'><button class='btn small ghost danger' data-action='delete-sale' data-id='"+s.id+"'>Remove</button></div></div>";
  }
  function saleRow(s){
    if (s.orderState === "cancelled") return cancelledRow(s);
    var p = productById(s.productId);
    var name = p ? p.name : "Unknown item";
    var linked = batchesForSale(s.id);
    var notRecv = linked.filter(function(b){ return b.status!=="received"; });
    var stockTag = "", recvBtn = "";
    var payTag = s.lifecycleStatus ? "<span class='badge lifecycle-"+s.lifecycleStatus+"'>"+(s.lifecycleStatus==="pending"?"Pending payout":"Paid out")+"</span>" : "";
    var autoTag = (s.ownerSource==="auto" && s.attributedTo && s.lifecycleStatus!=="completed") ? "<span class='badge label-note' title='Split automatically by who bought what. It can shift as more orders arrive until this one is paid out — tap the owner to lock it.'>Auto-split</span>" : "";
    var labelTag = (s.profitSource==="ebay-provisional" && s.ebayShipped && s.lifecycleStatus!=="completed") ? "<span class='badge label-note' title='eBay hasn&#39;t reported the shipping label cost yet, so this is before it'>Before label cost</span>" : "";
    return "<div class='sale-row'>"+prodThumb(p, name)+
      "<div class='sale-main'>"+
        "<div class='sale-title'>"+esc(name)+"</div>"+
        "<div class='sale-sub'>"+esc(s.buyerName||"Unknown buyer")+" · "+fmtDate(s.saleDate)+(s.orderNumber?" · #"+esc(s.orderNumber):"")+(Number(s.quantitySold)>1?" · qty "+s.quantitySold:"")+"</div>"+
        "<div class='sale-tags'>"+ownerBadge(s)+autoTag+stockTag+payTag+labelTag+(s.orderState==="cancel_requested" ? "<span class='badge label-note'>Cancel requested</span>" : "")+(Number(s.adFees)>0.004 ? "<span class='badge label-note' title='Promoted-listing fee eBay charged on this sale. It is already taken out of the payout.'>Ad fee "+money(s.adFees)+"</span>" : "")+(saleProfit(s)==null ? costPill() : (saleProfit(s) < 0 ? "<span class='cost-badge mini'><span class='ic' data-icon='coin'></span>Loss, check the cost</span>" : ""))+"</div>"+
      "</div>"+
      "<div class='sale-money'><div class='sale-profit'>"+money(s.netProfit)+"</div><div class='sale-sub'>payout</div>"+
        (function(){ var pr = saleProfit(s); return pr==null ? "<div class='sale-sub cost-missing'>profit: add cost</div>" : "<div class='sale-sub cost-known'>profit "+money(pr)+"</div>"; })()+"</div>"+
      "<div class='sale-actions'>"+recvBtn+
        (s.createdBy==="ebay-sync" && s.orderNumber ? "<a class='btn small ghost' target='_blank' rel='noopener' href='https://www.ebay.com/sh/ord/details?orderid="+encodeURIComponent(s.orderNumber)+"'>eBay</a>" : "")+
        "<button class='btn small ghost' data-action='sale-breakdown' data-id='"+s.id+"'>Breakdown</button>"+
        "<button class='btn small ghost' data-action='edit-sale' data-id='"+s.id+"'>Edit</button>"+
        "<button class='btn small ghost danger' data-action='delete-sale' data-id='"+s.id+"'>Remove</button>"+
      "</div></div>";
  }

  function renderSales(){
    var live = state.sales.slice().sort(bySaleNewest);
    var canc = (state.cancelled || []).slice().sort(bySaleNewest);
    var rows = salesFilter === "cancelled" ? canc : (salesFilter === "all" ? live.concat(canc).sort(bySaleNewest) : live);   // cancelled ones show in the main list too, in red
    var total = totalNetProfit(), pending = pendingProfit();
    var html = "<div class='tiles mini'>"+
      "<div class='tile t-profit'><div class='eyebrow'>Total payout</div><div class='value'>"+money(total)+"</div><div class='sub'>"+state.sales.length+" sale"+(state.sales.length===1?"":"s")+"</div></div>"+
      "<div class='tile t-pending'><div class='eyebrow'>Pending payout</div><div class='value'>"+money(pending)+"</div><div class='sub'>waiting on eBay</div></div>"+
      "<div class='tile t-brand'><div class='eyebrow'>Paid out</div><div class='value'>"+money(total-pending)+"</div><div class='sub'>ready to collect</div></div>"+
      "</div>";
    html += "<div class='section-head'><h2>All sales</h2><span class='head-actions'><button class='btn' data-action='export-sales' aria-label='Export sales as a spreadsheet'><span class='ic' data-icon='download'></span> Export</button>"+
      "<button class='btn primary' data-action='open-add-sale'><span class='ic' data-icon='plus'></span> Record sale</button></span></div>";
    if (!live.length && !canc.length){ return html + "<div class='card empty'><div class='ic' data-icon='sales'></div>No sales yet — they appear here as soon as eBay reports one.</div>"; }
    var counts = { all:live.length + canc.length, pending:0, paid:0, unassigned:0, nocost:0, cancelled:canc.length, Jon:0, Jax:0 };
    live.forEach(function(sa){
      if (saleProfit(sa)==null) counts.nocost++;
      if (sa.lifecycleStatus==="pending") counts.pending++;
      if (sa.lifecycleStatus==="completed") counts.paid++;
      if (!sa.attributedTo) counts.unassigned++; else counts[sa.attributedTo]++;
    });
    var chipDefs = [["all","All"],["pending","Pending payout"],["paid","Paid out"],["unassigned","Unassigned"],["nocost","Missing cost"],["Jon","Jon"],["Jax","Jax"]].concat(canc.length ? [["cancelled","Cancelled"]] : []);
    html += "<div class='filter-bar'><div class='search'><span class='ic' data-icon='search'></span>"+
      "<input id='salesSearch' type='search' placeholder='Search buyer, item or order #' value='"+esc(salesQ)+"' aria-label='Search sales' autocomplete='off'></div>"+
      "<div class='fchips'>"+chipDefs.map(function(c){
        return "<button type='button' class='fchip"+(salesFilter===c[0]?" on":"")+"' data-action='sales-filter' data-f='"+c[0]+"'>"+c[1]+"<b>"+(counts[c[0]]||0)+"</b></button>";
      }).join("")+"</div></div>";
    var shown = rows.filter(function(sa){
      if (salesFilter==="cancelled") return !salesQ.trim() || matchesQuery([sa.buyerName, (productById(sa.productId)||{}).name, sa.orderNumber].join(" "), salesQ);
      if (salesFilter==="pending" && sa.lifecycleStatus!=="pending") return false;
      if (salesFilter==="paid" && sa.lifecycleStatus!=="completed") return false;
      if (salesFilter==="unassigned" && sa.attributedTo) return false;
      if (salesFilter==="nocost" && saleProfit(sa)!=null) return false;
      if ((salesFilter==="Jon" || salesFilter==="Jax") && sa.attributedTo!==salesFilter) return false;
      if (!salesQ.trim()) return true;
      var pr = productById(sa.productId);
      return matchesQuery([sa.buyerName, pr && pr.name, sa.orderNumber, sa.attributedTo].join(" "), salesQ);
    });
    if (!shown.length) return html + "<div class='card empty'><div class='ic' data-icon='search'></div>No sales match that. Clear the search or pick another filter.</div>";
    return html + "<div class='sales-list'>"+shown.slice(0, salesShown).map(saleRow).join("")+"</div>"+
      (shown.length > salesShown ? "<div class='more-wrap'><button class='btn' data-action='sales-more'>Show "+Math.min(30, shown.length-salesShown)+" more · "+(shown.length-salesShown)+" left</button></div>" : "");
  }
  // every sale (and cancelled ones, marked) as a spreadsheet: for taxes and your own records
  function exportSalesCSV(){
    var q = function(v){ v = v==null ? "" : String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    var head = ["Sale date","Order #","Item","Buyer","Qty","Payout","Goes to","Cost per unit","Total cost","Profit","Payout status","Order status"];
    var rows = state.sales.concat(state.cancelled||[]).slice().sort(bySaleNewest).map(function(sa){
      var pr = productById(sa.productId), cancelled = sa.orderState==="cancelled";
      var unit = cancelled ? null : unitCostFor(sa), profit = cancelled ? null : saleProfit(sa);
      return [sa.saleDate||"", sa.orderNumber||"", pr ? pr.name : "", sa.buyerName||"", sa.quantitySold||1, Number(sa.netProfit||0).toFixed(2), sa.attributedTo||"",
              unit==null ? "" : unit.toFixed(2), unit==null ? "" : (unit*Number(sa.quantitySold||1)).toFixed(2), profit==null ? "" : profit.toFixed(2),
              sa.lifecycleStatus==="completed" ? "Paid out" : "Pending payout", cancelled ? "Cancelled or refunded" : (sa.orderState==="cancel_requested" ? "Cancel requested" : "Active")];
    });
    var csv = [head].concat(rows).map(function(r){ return r.map(q).join(","); }).join("\r\n");
    var blob = new Blob(["\ufeff"+csv], { type:"text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "keptmint-sales-"+todayISO()+".csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Exported "+rows.length+" sale"+(rows.length===1?"":"s"));
  }
  function matchesQuery(text, q){
    var words = String(q||"").toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    var t = String(text||"").toLowerCase();
    return words.every(function(w){ return t.indexOf(w)!==-1; });
  }

  function renderSettlements(){
    var rows = state.settlements.slice().sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
    var bal = computeBalance();
    var bl = balanceLine(bal, whoAmI);
    var pending = pendingBalance();
    // Only Jon-attributed sales ever create a debt Jax owes Jon (Jax's own eBay account already
    // holds every dollar directly, so a sale Jax attributes to himself never owes anyone
    // anything, pending or not) — this count is deliberately narrower than "all pending sales"
    // for the same reason computeBalance() only ever sums Jon's side. Spelled out explicitly so
    // it doesn't read as a bug when the total sale count and this count don't match. Named both
    // people explicitly rather than using "he"/"you" — this tile renders identically for
    // whoever's viewing, and a pronoun picked from Jon's perspective ("...since HE already
    // keeps...") reads as a factual error when Jax is the one looking at his own page.
    var pendingSub = pending.count
      ? pending.count+" sale"+(pending.count===1?"":"s")+" attributed to Jon, still shipping / awaiting eBay payout — sales attributed to Jax aren't counted here, since Jax already keeps that money directly"
      : "Nothing attributed to Jon is still waiting on eBay to pay out.";

    // Jon's call: his own net profit is what he actually wants to see first when he opens this
    // tab day to day — the cross-partner debt tiles matter less often (only when it's actually
    // time to settle up), so they now sit below instead of leading. Whoever's currently viewing
    // gets their own total/available/pending breakdown here, independent of whether it affects
    // the shared balance (a sale Jax attributes to himself never owes anyone anything, but he
    // still wants to track it — see ownerProfitBreakdown()).
    var mine = ownerProfitBreakdown(whoAmI);
    var mineSub = mine.pendingCount
      ? money(mine.available)+" available · "+money(mine.pending)+" pending across "+mine.pendingCount+" sale"+(mine.pendingCount===1?"":"s")
      : money(mine.available)+" available · nothing pending right now";
    var rp = ownerRealProfit(whoAmI);
    var html = "<div class='tiles'><div class='tile t-profit'><div class='eyebrow'>Your payout</div><div class='value'>"+money(mine.total)+"</div><div class='sub'>"+esc(mineSub)+"</div></div>"+
      "<div class='tile t-brand'><div class='eyebrow'>Your profit (internal)</div><div class='value'>"+money(rp.profit)+"</div><div class='sub'>"+
        (rp.missing ? "so far, "+rp.missing+" sale"+(rp.missing===1?"":"s")+" still need a cost. " : "Payout minus what you paid. ")+"Just for your own tracking. It never changes what you and Jax owe each other.</div></div></div>";

    html += "<div class='section-head'><h2>Between you and Jax</h2></div>";
    html += "<div class='tiles'>"+
      "<div class='tile tone-"+bl.tone+"'><div class='eyebrow'>Available to settle now</div><div class='value'>"+esc(bl.text)+"</div><div class='sub'>From sales eBay has already paid out — the money's actually landed. Uses the full payout; what you paid for the items doesn't reduce it.</div></div>"+
      "<div class='tile'><div class='eyebrow'>Pending payout</div><div class='value'>"+money(pending.amount)+"</div><div class='sub'>"+esc(pendingSub)+" — not collectible until then.</div></div>"+
      "</div>";

    html += "<div class='section-head'><h2>Payment history</h2><button class='btn primary' data-action='open-add-settlement'><span class='ic' data-icon='plus'></span> Record payment</button></div>";
    if (!rows.length){ html += "<div class='card empty'><div class='ic' data-icon='settlements'></div>No payments logged between you two yet.</div>"; return html; }
    html += "<div class='pay-list'>";
    rows.slice().reverse().forEach(function(t){
      html += "<div class='pay-row'>"+
        "<div class='pay-flow'>"+ownerPill(t.from)+"<span class='pay-arrow'>→</span>"+ownerPill(t.to)+"</div>"+
        "<div class='pay-main'><div class='pay-amt'>"+money(t.amount)+"</div><div class='sale-sub'>"+fmtDate(t.date)+(t.note?" · "+esc(t.note):"")+"</div></div>"+
        "<button class='btn small ghost danger' data-action='delete-settlement' data-id='"+t.id+"'>Remove</button></div>";
    });
    return html + "</div>";
  }

  function openModal(title, bodyHtml, footHtml, opts){

    $("#modalRoot").innerHTML =
      "<div class='modal-backdrop' data-action='backdrop'><div class='modal"+(opts.wide?" wide":"")+"' role='dialog' aria-modal='true' aria-label='"+esc(title)+"' tabindex='-1'>"+

      "<div class='modal-body'>"+bodyHtml+"</div>"+
      "<div class='modal-foot'>"+footHtml+"</div>"+
      "</div></div>";
    paintIcons();
    document.querySelectorAll("#modalRoot input[type=number]").forEach(function(i){
      i.setAttribute("inputmode", (i.step==="any" || String(i.step).indexOf(".")>-1) ? "decimal" : "numeric");
    });

  function editExtra(prev, who, pay){
    var x = {};

      "<div class='field'><label>Note</label><textarea id='f_note'>"+esc(s.note||"")+"</textarea></div>"+
      "<input type='hidden' id='f_id' value='"+id+"'>",
      "<button class='btn' data-action='close-modal'>Cancel</button><button class='btn primary' data-action='submit-edit-sale'>Save</button>"
    );
  }


  function openAddSettlementModal(){
    // start from what is actually owed right now (the full payout of Jon's paid-out sales, less what was already settled)
    var bal = computeBalance(), fromWho = bal < 0 ? "Jon" : "Jax", toWho = bal < 0 ? "Jax" : "Jon";
    var owed = Math.abs(bal) > 0.005 ? String(round2(Math.abs(bal))) : "";
    openModal("Record payment",
      "<div class='row2'><div class='field'><label>From</label><select id='f_from'>"+ownerOptions(fromWho)+"</select></div>"+
      "<div class='field'><label>To</label><select id='f_to'>"+ownerOptions(toWho)+"</select></div></div>"+
      "<div class='row2'><div class='field'><label>Amount</label><input id='f_amount' type='number' min='0' step='0.01' inputmode='decimal' value='"+owed+"' required>"+(owed ? "<div class='hint'>Filled in with what is owed right now.</div>" : "")+"</div>"+
      "<div class='field'><label>Date</label><input id='f_date' type='date' value='"+todayISO()+"'></div></div>"+
      "<div class='field'><label>Note</label><textarea id='f_note' placeholder='e.g. Venmo for Sept payouts'></textarea></div>",
      "<button class='btn' data-action='close-modal'>Cancel</button><button class='btn primary' data-action='submit-add-settlement'>Save payment</button>"
    );
  }

  // Native window.confirm()/prompt() get silently swallowed by this platform's sandbox —
  // same reason the old new-item prompt() never worked. Use a real in-page modal instead.
  var pendingConfirm = null;
  function confirmAction(message, onYes, opts){
    opts = opts || {};
    pendingConfirm = onYes;
    openModal(opts.title || "Are you sure?",
      opts.html || "<div>"+esc(message)+"</div>",
      "<button class='btn' data-action='close-modal'>Cancel</button><button class='btn primary"+(opts.danger===false?"":" danger")+"' data-action='confirm-yes'>"+(opts.okLabel||"Remove")+"</button>"
    );
  }




  // ---------- event wiring ----------
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.dataset.action;

    if (action==="backdrop" && e.target===t) return closeModal();
    if (action==="close-modal") return closeModal();
    if (action==="confirm-yes"){
      var cb = pendingConfirm; pendingConfirm = null;
      closeModal();
      if (cb) cb();
      return;
    }
    if (action==="bought-all"){ var bg = purchaseGroups().filter(function(x){ return x.key===t.dataset.key; })[0]; if (bg){ var bc = { Jon:0, Jax:0 }; bc[t.dataset.who] = bg.qty; openPurchaseConfirm(t.dataset.key, bc); } return; }
    if (action==="bought-even"){ var be = purchaseGroups().filter(function(x){ return x.key===t.dataset.key; })[0]; if (be) openPurchaseConfirm(t.dataset.key, { Jon:Math.ceil(be.qty/2), Jax:Math.floor(be.qty/2) }); return; }
    if (action==="bought-split"){
      if ($("#p_cost") && pendingBought) pendingBought.cost = $("#p_cost").value; openBoughtModal(t.dataset.key); return; }
    if (action==="submit-bought"){ openPurchaseConfirm(t.dataset.key, { Jon:$("#f_bj").value, Jax:$("#f_bx").value }); return; }
    if (action==="sales-filter"){ salesFilter = t.dataset.f; salesShown = 30; render(); return; }
    if (action==="cost-all"){
      var allItems = {}, missKeys = missingCostGroups().map(function(x){ return x.g.key; });
      productGroupList().forEach(function(g){ allItems[g.key] = { checked: missKeys.indexOf(g.key)!==-1 }; });
      pendingTrip = { who: whoAmI, total:"", other:"", otherQty:"1", mode:"prop", items: allItems };
      openTripModal(); return;
    }
    if (action==="cost-one"){ openItemTrip(t.dataset.key); return; }
    if (action==="export-sales"){ exportSalesCSV(); return; }
    if (action==="inv-filter"){ invFilter = t.dataset.f; render(); return; }
    if (action==="goto-costs"){ invFilter = "missing"; setTab("inventory"); return; }
    if (action==="sales-more"){ salesShown += 30; render(); return; }
    if (action==="confirm-purchase"){ applyPurchase(t.dataset.key, { Jon:t.dataset.jon, Jax:t.dataset.jax }, ($("#p_cost")||{}).value); pendingBought = null; closeModal(); return; }
    if (action==="undo-purchase"){ undoPurchase(); var tt = t.closest(".toast"); if (tt) tt.remove(); return; }
    if (action==="assign-owner"){ openOwnerConfirm([t.dataset.id], t.dataset.who, false); return; }
    if (action==="assign-all-owner"){ openOwnerConfirm(needsOwnerSales().map(function(x){ return x.id; }), t.dataset.who, false); return; }
    if (action==="open-trip"){ pendingTrip = null; openTripModal(); return; }
    if (action==="trip-review"){ openTripConfirm(); return; }
    if (action==="trip-total-items"){
      var cc = tripCalc(readTrip()); $("#t_total").value = round2(cc.subtotal + (cc.other||0)); updateTripSummary(); return;
    }
    if (action==="trip-zero"){ var r1 = t.closest(".trip-row"); if (r1){ r1.querySelector(".trip-price").value = "0"; clearTripFlag(r1); updateTripSummary(); } return; }
    if (action==="trip-skip"){ var r2 = t.closest(".trip-row"); if (r2){ r2.querySelector(".trip-chk").checked = false; clearTripFlag(r2); updateTripSummary(); } return; }
    if (action==="trip-zero-all" || action==="trip-skip-all"){
      document.querySelectorAll(".trip-row.missing").forEach(function(row){
        if (action==="trip-zero-all") row.querySelector(".trip-price").value = "0"; else row.querySelector(".trip-chk").checked = false;
        row.classList.remove("missing"); var w = row.querySelector(".trip-warn"); if (w) w.remove();
      });
      paintBlankBar(); updateTripSummary(); return;
    }
    if (action==="trip-toggle-all"){
      var boxes = document.querySelectorAll(".trip-chk");
      var allOn = Array.prototype.every.call(boxes, function(x){ return x.checked; });
      boxes.forEach(function(x){ x.checked = !allOn; if (allOn) clearTripFlag(x.closest(".trip-row")); });
      t.textContent = allOn ? "Select all" : "Clear all";
      updateTripSummary(); return;
    }
    if (action==="trip-back"){ openTripModal(); return; }
    if (action==="trip-apply"){ applyTrip(); closeModal(); return; }
    if (action==="undo-trip"){ undoTrip(); var tz = t.closest(".toast"); if (tz) tz.remove(); return; }
    if (action==="confirm-owner"){ applyOwner(t.dataset.ids.split(","), t.dataset.who, t.dataset.flip==="1"); closeModal(); return; }
    if (action==="undo-owner"){ undoOwner(); var tq = t.closest(".toast"); if (tq) tq.remove(); return; }
    if (action==="flip-owner"){ flipOwner(t.dataset.id); return; }
    if (action==="goto-sales") return setTab("sales");
    if (action==="market-search") return openMarketSearch(t.dataset.key, t.dataset.start==="1");
    if (action==="market-stop"){ requestMarket(t.dataset.key, "stop", ""); return; }
    if (action==="market-submit"){
      var mq = ($("#f_msearch").value||"").replace(/\s+/g," ").trim();
      if (mq.length < 3){ toast("Type at least a few words to search for."); return; }
      var mk = $("#f_mkey").value; closeModal(); requestMarket(mk, "search", mq); return;
    }
    if (action==="books-open") return openBooks();
    if (action==="goto-insights") return setTab("insights");
    if (action==="sale-breakdown") return openBreakdown(t.dataset.id);
    if (action==="ins-sort"){ insSort = t.dataset.f; render(); return; }

    if (action==="open-add-batch") return openAddBatchModal(t.dataset.product);
    if (action==="edit-batch") return openEditBatchModal(t.dataset.id);
    if (action==="open-add-sale") return openAddSaleModal(t.dataset.product||null);
    if (action==="edit-sale") return openEditSaleModal(t.dataset.id);
    if (action==="open-add-settlement") return openAddSettlementModal();

    if (action==="delete-batch"){
      var delBatchId = t.dataset.id;
      confirmAction("Remove this batch? This can't be undone.", function(){ deleteBatch(delBatchId); });
      return;
    }
    if (action==="delete-sale"){
      var delSaleId = t.dataset.id;
      var delSale = state.sales.concat(state.cancelled||[]).find(function(x){ return x.id===delSaleId; }) || {};
      confirmAction("Remove this sale? "+(delSale.createdBy==="ebay-sync" ? "It came from eBay and stays removed (the sync won't bring it back). " : "")+"Any purchase entry the app auto-created for it goes too. This can't be undone.",
        function(){ removeSale(delSaleId); });
      return;
    }
    if (action==="delete-settlement"){
      var delSettlementId = t.dataset.id;
      confirmAction("Remove this payment record? This can't be undone.", function(){ deleteSettlement(delSettlementId); });
      return;
    }


    if (action==="submit-add-batch"){
      addBatch({
        productId: $("#f_product").value, owner: $("#f_owner").value,
        quantity: Number($("#f_qty").value)||1, unitCost: Number($("#f_cost").value)||0, costKnown: $("#f_cost").value!=="",
        status: "received", expectedArrival: null, receivedDate: todayISO(),
        note: $("#f_note").value.trim(), needsReview:false
      });
      toast("Batch added");
      closeModal();
      return;
    }

    if (action==="submit-edit-batch"){
      var id = $("#f_id").value;
      // Saving an edit at all is the acknowledgment that this batch has been reviewed — if the
      // note field still holds the exact auto-fill placeholder text untouched, clear it instead
      // of leaving it to sit there forever next to a now-real cost the user just entered.
      var editedNote = $("#f_note").value.trim();
      if (editedNote === AUTO_BATCH_NOTE || editedNote === PURCHASE_NOTE) editedNote = "";
      var oldB = state.batches.find(function(x){ return x.id===id; });
      var costRaw = $("#f_cost").value, newCost = Number(costRaw)||0;
      updateBatch(id, {
        owner: $("#f_owner").value, quantity: Number($("#f_qty").value)||1,
        unitCost: newCost, costKnown: costRaw!=="",
        note: editedNote, needsReview:false
      });
      var scopeEl = document.querySelector("input[name='f_scope']:checked"), nApplied = 0;
      if (scopeEl && scopeEl.value!=="one" && costRaw!=="" && oldB){
        unpricedSiblings(oldB).filter(function(x){ return scopeEl.value==="all" || x.owner===oldB.owner; }).forEach(function(x){
          nApplied++;
          updateBatch(x.id, { unitCost:newCost, costKnown:true, needsReview:false, note:(x.note===AUTO_BATCH_NOTE || x.note===PURCHASE_NOTE) ? "" : (x.note||"") });
        });
      }
      toast(nApplied ? "Price applied to this batch and "+nApplied+" more" : "Batch updated");
      closeModal();
      return;
    }

    if (action==="submit-add-sale"){
      var pid2 = $("#f_product").value;
      if (!pid2){ toast("Pick an item"); return; }
      var profit = $("#f_profit").value;
      if (profit===""){ toast("Enter the payout"); return; }
      var addQty = Number($("#f_qty").value)||1;
      var addDate = $("#f_date").value || todayISO();
      var addWho = $("#f_who").value;
      // Captured now, not re-read inside the .then() below -- closeModal() runs synchronously
      // right after this, so by the time that callback fires #f_funds no longer exists in the DOM.
      var addFundsVal = $("#f_funds").value;
      addSale({
        productId: pid2, quantitySold: addQty,
        saleDate: addDate, netProfit: Number(profit)||0,
        soldPrice: $("#f_price").value ? Number($("#f_price").value) : null,
        attributedTo: addWho, note: $("#f_note").value.trim(),
        buyerName: $("#f_buyer").value.trim() || null,
        orderNumber: $("#f_ordernum").value.trim() || null,
        lifecycleStatus: addFundsVal
      }).then(function(ref){
        var newSaleId = ref && ref.id ? ref.id : ref;
        // excludeSaleId = its own id, not null — see the matching comment in importCSVRecords
        // for why: the offline/local fallback path adds this sale to state.sales synchronously,
        // before this callback runs, so excluding anything else risks double-counting it.
        syncStockForSale(pid2, addQty, addWho, addDate, newSaleId, newSaleId).then(function(){
          // eBay only ever releases payout once an item has shipped and been delivered — funds
          // status "Completed" is exactly as hard a proof of "already in hand" as the OCR
          // "Delivered on" signal submit-scan-review already acts on (see markSaleReceived's own
          // comment), so recording a sale as already paid out shouldn't also require a separate
          // manual "Mark received" click on top of that.
          if (addFundsVal === "completed") return markSaleReceived(newSaleId);
        });
      });
      toast("Sale recorded");
      closeModal();
      return;
    }

    if (action==="submit-edit-sale"){
      var sid = $("#f_id").value;
      var editPid = $("#f_product").value;
      var editQty = Number($("#f_qty").value)||1;
      var editDate = $("#f_date").value || todayISO();
      var editWho = $("#f_who").value || null;
      var editFundsVal = $("#f_funds").value;
      var prevSale = state.sales.find(function(x){ return x.id===sid; }) || {};
      if (editWho && prevSale.attributedTo && editWho !== prevSale.attributedTo){
        batchesForSale(sid).forEach(function(b){ updateBatch(b.id, { owner: editWho }); }); // its stock follows it, like the owner tap
      }
      updateSale(sid, Object.assign({
        productId: editPid, quantitySold: editQty,
        saleDate: editDate, netProfit: ($("#f_profit").value==="" && prevSale.netProfit==null) ? null : (Number($("#f_profit").value)||0),
        soldPrice: $("#f_price").value ? Number($("#f_price").value) : null,
        attributedTo: editWho, note: $("#f_note").value.trim(),
        buyerName: $("#f_buyer").value.trim() || null,
        orderNumber: $("#f_ordernum").value.trim() || null,
        lifecycleStatus: editFundsVal
      }, editExtra(prevSale, editWho, Number($("#f_profit").value)||0)));
      (editWho ? syncStockForSale(editPid, editQty, editWho, editDate, sid, sid) : Promise.resolve()).then(function(){
        // Same reasoning as submit-add-sale above: a payout marked "Completed" here (including
        // editing an OLDER sale up to that status after the fact) is proof enough on its own.
        if (editFundsVal === "completed") return markSaleReceived(sid);
      });
      toast("Sale updated");
      closeModal();
      return;
    }


    if (action==="submit-add-settlement"){
      var from = $("#f_from").value, to = $("#f_to").value;
      if (from===to){ toast("From and To must be different people"); return; }
      var amt = $("#f_amount").value;
      if (!(Number(amt) > 0)){ toast("Enter an amount above zero"); return; }
      addSettlement({ from: from, to: to, amount: Number(amt)||0, date: $("#f_date").value||todayISO(), note: $("#f_note").value.trim() });
      toast("Payment logged");
      closeModal();
      return;
    }
  });

  document.querySelectorAll(".navbtn").forEach(function(b){ b.addEventListener("click", function(){ if (b.dataset.tab==="inventory") invFilter = "all"; setTab(b.dataset.tab); }); });

  document.addEventListener("keydown", function(e){
    var m = $("#modalRoot .modal");
    if (e.key === "Escape" && m) closeModal();
    if (e.key === "Enter" && m && e.target && e.target.tagName === "INPUT" && ["checkbox","radio","button","file"].indexOf(e.target.type) === -1){
      var pb = m.querySelector(".modal-foot .btn.primary");
      if (pb){ e.preventDefault(); pb.click(); }
    }
    if (e.key === "Tab" && m){
      var f = Array.prototype.filter.call(m.querySelectorAll("button, input, select, textarea, [tabindex]:not([tabindex='-1'])"),
        function(x){ return !x.disabled && x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length-1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === m)){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener("change", function(e){
    if (e.target && e.target.closest && e.target.closest("#modalRoot .seg-choice, #modalRoot .trip-chk, #modalRoot #t_who")){
      if (e.target.classList.contains("trip-chk") && !e.target.checked) clearTripFlag(e.target.closest(".trip-row"));
      updateTripSummary();
    }
  });
  var searchTimer = null;
  document.addEventListener("input", function(e){
    var id = e.target && e.target.id;
    if (e.target && e.target.closest && e.target.closest("#modalRoot .trip-list, #modalRoot #t_total, #modalRoot #t_who, #modalRoot #t_other, #modalRoot #t_otherqty")){
      if (e.target.classList.contains("trip-price") && e.target.value !== "") clearTripFlag(e.target.closest(".trip-row"));
      updateTripSummary(); return;
    }
    if (id !== "salesSearch" && id !== "invSearch") return;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      if (id === "salesSearch"){ salesQ = e.target.value; salesShown = 30; } else { invQ = e.target.value; }
      render();
    }, 120);
  });


  var whoSel = $("#whoAmI");
  OWNERS.forEach(function(o){ var opt=document.createElement("option"); opt.value=o; opt.textContent=o; whoSel.appendChild(opt); });
  whoSel.value = whoAmI;
  whoSel.addEventListener("change", function(){ whoAmI = whoSel.value; try { localStorage.setItem("flipLedgerWhoAmI", whoAmI); } catch(e){} render(); });

  window.addEventListener("unhandledrejection", function(e){
    var msg = String((e.reason && (e.reason.code || e.reason.message)) || "");
    if (/permission|unavailable|network|denied|failed/i.test(msg)) toast("That didn't save. Check your connection and try again.");
  });

  // ---------- boot ----------
  function seedLocalExample(){
    var pid = uid();
    state.products = [{ id: pid, name:"Example: Charizard ex Booster Box", category:"Pokémon TCG", createdAt: Date.now() }];
    state.batches = [{ id: uid(), productId: pid, owner:"Jon", quantity:2, unitCost:89.99, status:"transit", expectedArrival: todayISO(), note:"Example row — add your real items from Inventory.", needsReview:false, createdAt: Date.now() }];
    state.sales = [];
    state.settlements = [];
  }

  // Firebase config is intentionally public in client code — Firebase's real access control
  // lives in Firestore Security Rules (deployed separately in the console), not in keeping
  // this object secret. This replaces the old `window.claude.use("db"/"assets")` capabilities,
  // which only existed when this page was served as a Claude Artifact.
  var firebaseConfig = {
    apiKey: "AIzaSyCwawIqm-fnjzzrk84gdJZ1oZ9qSKw_APw",
    authDomain: "keptmintco.firebaseapp.com",
    projectId: "keptmintco",
    storageBucket: "keptmintco.firebasestorage.app",
    messagingSenderId: "1063151863897",
    appId: "1:1063151863897:web:377148710df2d7a7e04948",
    measurementId: "G-33YKFG8WRH"
  };



  async function boot(){
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      await firebase.auth().signInAnonymously();
      db = firebase.firestore();
      subscribeCollections();
    } catch(e){
      console.warn("Firebase init failed", e);
      db = null;
      showSyncBanner("Couldn't connect to the shared database — check your internet connection and reload. Changes won't be saved until this reconnects.");
      seedLocalExample();
    }
    render();
    if (tab==="orders") render();
  }
  boot();
})();
</script>
